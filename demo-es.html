<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Ficha de ejemplo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* WorkoutPlayer · token e temi (chiaro, scuro automatico, scuro forzato). Da src/style.css:1-26. */
:root {
  --bg: #ECEFEA; --surface: #FFFFFF; --surface-2: #E1E5DF; --line: #CFD5CD;
  --ink: #14181A; --ink-2: #49545A; --ink-3: #6F7B80;
  --work: #D9480B; --rest: #0A8070; --prep: #9A6A00; --on-phase: #FFFFFF;
  --note-bg: #FFF4D6; --note-ink: #4A3600; --note-line: #E9C767;
  --img-filter: none; --img-blend: multiply;
  --phase: var(--ink);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1113; --surface: #181D20; --surface-2: #232A2E; --line: #2E373B;
    --ink: #F0F3EE; --ink-2: #B1BBBF; --ink-3: #87939A;
    --work: #FF6B2C; --rest: #2CC7B0; --prep: #F0B429; --on-phase: #0E1113;
    --note-bg: #2B2410; --note-ink: #F6E3A6; --note-line: #6B5618;
    --img-filter: invert(1) hue-rotate(180deg); --img-blend: screen;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1113; --surface: #181D20; --surface-2: #232A2E; --line: #2E373B;
  --ink: #F0F3EE; --ink-2: #B1BBBF; --ink-3: #87939A;
  --work: #FF6B2C; --rest: #2CC7B0; --prep: #F0B429; --on-phase: #0E1113;
  --note-bg: #2B2410; --note-ink: #F6E3A6; --note-line: #6B5618;
  --img-filter: invert(1) hue-rotate(180deg); --img-blend: screen;
}
/* WorkoutPlayer · stili dei componenti (home, anteprima, player, dialog, schermata finale). Da src/style.css:28-193;
   aggiunte: il colore del passo libero (#player[data-kind="free"]); per l'API v1 il blocco a cronometro
   (#player[data-kind="block"]), il contatore dei giri (.count), le righe di riepilogo
   che vanno a capo (.row.long). */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 17px/1.45 var(--body); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--phase); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; }
.eyebrow { font: 600 13px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* ---------- Home ---------- */
#home .wrap, #preview .wrap, #done .wrap { padding-block: 28px 40px; display: flex; flex-direction: column; gap: 22px; }
.masthead h1 { font: 700 46px/0.95 var(--display); letter-spacing: -.01em; text-transform: uppercase; margin-top: 6px; }
.masthead p { color: var(--ink-2); margin-top: 10px; max-width: 46ch; }
.choices { display: flex; flex-direction: column; gap: 12px; }
.choice {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 14px 16px 16px; width: 100%;
}
.choice:active { transform: translateY(1px); }
.choice .letter { font: 700 64px/0.8 var(--display); color: var(--work); text-align: center; }
.choice .letter svg { width: 48px; height: 48px; display: block; margin: 0 auto; }
.choice .t { display: block; font: 600 24px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.choice .focus { display: block; color: var(--ink-2); font-size: 15px; margin-top: 3px; }
.choice .meta { display: block; color: var(--ink-3); font-size: 13.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.choice .go { color: var(--ink-3); font-size: 26px; line-height: 1; }
.resume {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  background: var(--ink); color: var(--bg); border-radius: 6px; padding: 14px 16px;
}
.resume strong { font: 600 19px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; display: block; }
.resume span { font-size: 14px; opacity: .8; }
.resume .row { display: flex; gap: 8px; }
.resume button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 4px; padding: 9px 14px; font-weight: 600; font-size: 15px; }
.resume button.solid { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.fine { color: var(--ink-3); font-size: 13.5px; }
.rules { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.rules ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 15px; display: flex; flex-direction: column; gap: 4px; }

/* ---------- Preview ---------- */
.back { align-self: flex-start; background: none; border: 0; padding: 6px 0; color: var(--ink-2); font-weight: 500; }
.pv-head h1 { font: 700 40px/0.95 var(--display); text-transform: uppercase; margin-top: 4px; }
.pv-head p { color: var(--ink-2); margin-top: 8px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; }
.stats b { font: 600 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--ink-3); }
.plan { display: flex; flex-direction: column; gap: 18px; }
.plan section { display: flex; flex-direction: column; gap: 2px; }
.plan h3 { font: 600 13px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.plan .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.plan .row span:last-child { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }
.cta {
  position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px;
}
.btn {
  border: 0; border-radius: 6px; padding: 17px 18px; font: 600 22px/1 var(--display); letter-spacing: .04em; text-transform: uppercase;
  background: var(--phase); color: var(--on-phase); flex: 1; min-height: 58px;
}
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); flex: 0 0 auto; }
#preview, #done { --phase: var(--work); }

/* ---------- Player ---------- */
#player[data-kind="work"] { --phase: var(--work); }
#player[data-kind="rest"] { --phase: var(--rest); }
#player[data-kind="prep"] { --phase: var(--prep); }
#player[data-kind="free"] { --phase: var(--work); }
#player[data-kind="block"] { --phase: var(--work); }
#player[data-kind="gate"] { --phase: var(--ink); --on-phase: var(--bg); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px; }
.topbar .line { display: flex; align-items: center; gap: 8px; }
.topbar .where { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .where b { color: var(--ink); font-weight: 600; }
.icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; height: 40px; min-width: 40px; padding: 0 10px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.icon-btn svg { width: 18px; height: 18px; }
.track { display: flex; gap: 3px; height: 5px; }
.track i { display: block; background: var(--line); border-radius: 2px; overflow: hidden; min-width: 6px; }
.track i b { display: block; height: 100%; background: var(--phase); width: 0; transition: width .3s; }
.stage { padding-block: 16px 130px; display: flex; flex-direction: column; gap: 16px; }
.state {
  align-self: flex-start; font: 600 14px/1 var(--body); letter-spacing: .1em; text-transform: uppercase;
  background: var(--phase); color: var(--on-phase); padding: 7px 10px; border-radius: 3px;
}
.title h2 { font: 700 38px/0.98 var(--display); text-transform: uppercase; letter-spacing: -.005em; }
.title p { color: var(--ink-2); margin-top: 4px; font-size: 16px; }
.dial { position: relative; width: min(100%, 300px); aspect-ratio: 1; max-width: 100%; margin: 2px auto 0; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.dial circle { fill: none; stroke-width: 10; }
.dial .bg { stroke: var(--surface-2); }
.dial .fg { stroke: var(--phase); stroke-linecap: butt; transition: stroke-dashoffset .25s linear; }
.dial .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; }
.dial .big { font: 700 96px/0.9 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.dial .big.long { font-size: 80px; }
.dial .sub { font-size: 15px; color: var(--ink-2); font-weight: 500; }
.dial .sub2 { font: 600 20px/1 var(--display); color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: 4px; }
.paused .dial .big { opacity: .45; }
.adjust { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.adjust button { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; font-weight: 600; font-size: 15px; min-width: 76px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; display: flex; flex-direction: column; min-width: 78px; }
.chip span { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.chip b { font: 600 26px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.chip.kg .kgrow { display: flex; align-items: center; gap: 8px; }
.chip.kg button { width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; line-height: 1; font-weight: 600; }
.chip.kg small { font-size: 12px; color: var(--ink-3); }
.count { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.count b { display: block; font: 700 44px/1 var(--display); }
.count .btn { flex: 0 0 auto; min-height: 50px; font-size: 20px; }
.note { background: var(--note-bg); color: var(--note-ink); border: 1px solid var(--note-line); border-radius: 4px; padding: 11px 13px; font-weight: 500; }
.note .eyebrow { color: inherit; opacity: .75; display: block; margin-bottom: 3px; font-size: 12px; }
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
.figure img { display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 2 / 1; object-fit: contain; filter: var(--img-filter); mix-blend-mode: var(--img-blend); }
.how { display: flex; flex-direction: column; gap: 8px; }
.how ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
.how li::marker { font-family: var(--display); font-weight: 600; color: var(--ink-3); }
.gear { color: var(--ink-2); font-size: 15px; }
.nextup { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.gate-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.gate-ex { display: flex; flex-direction: column; }
.gate-ex .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.gate-ex .row span:last-child { color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 15px; }
.plan .row.long span:last-child, .gate-ex .row.long span:last-child { white-space: normal; text-align: right; }
.hr { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
.hr label { font-size: 15px; color: var(--ink-2); }
.hr input { width: 72px; font: 600 22px/1 var(--display); padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.hr output { font: 600 22px/1 var(--display); }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
}
.bar .wrap { display: flex; gap: 8px; align-items: stretch; }
.bar .nav { flex: 0 0 54px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 22px; }
.bar .nav:disabled { opacity: .35; }

/* ---------- Dialogs ---------- */
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 0; width: min(520px, calc(100% - 24px)); max-height: 84vh; }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
.dlg { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; }
.dlg header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dlg h3 { font: 700 26px/1 var(--display); text-transform: uppercase; }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg .btn { font-size: 19px; min-height: 50px; padding: 13px 16px; }
.sl-phase { font: 600 12.5px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }
.sl-item { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 2px; align-items: baseline; }
.sl-item span:last-child { color: var(--ink-3); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sl-item.done { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.sl-item.now { font-weight: 600; }
.sl-item.now span:first-child::before { content: "▸ "; color: var(--work); }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.set-row small { display: block; color: var(--ink-3); font-size: 13.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; flex: 0 0 auto; }
.seg button { border: 0; background: var(--surface); padding: 9px 12px; font-weight: 600; font-size: 15px; min-width: 46px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- Done ---------- */
.done-mark { font: 700 60px/0.92 var(--display); text-transform: uppercase; }
.done-mark em { font-style: normal; color: var(--work); }

@media (max-width: 380px) {
  .masthead h1 { font-size: 40px; } .title h2 { font-size: 33px; } .dial .big { font-size: 84px; } .dial .big.long { font-size: 70px; }
  .choice { grid-template-columns: 52px 1fr auto; } .choice .letter { font-size: 54px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<!-- WorkoutPlayer · scheletro delle viste e dei dialog (da src/body.html). I testi del piano (intestazione, regole del trainer) li riempie la libreria all'avvio; le parole fisse vengono dai file di lingua (lib/lang/, chiavi in data-i18n*). -->
<main id="home">
  <div class="wrap">
    <header class="masthead">
      <span class="eyebrow" id="homeKicker"></span>
      <h1 data-i18n="home.title"></h1>
      <p data-i18n="home.lead"></p>
    </header>
    <div id="resume" class="resume" hidden></div>
    <div id="choices" class="choices"></div>
    <section class="rules">
      <span class="eyebrow" id="rulesHead" data-i18n="home.rules"></span>
      <ul id="rulesList"></ul>
      <p class="fine" data-i18n="home.rulesNote"></p>
    </section>
  </div>
</main>

<main id="preview" hidden>
  <div class="wrap">
    <button class="back" id="pvBack" type="button" data-i18n="pv.back"></button>
    <header class="pv-head">
      <span class="eyebrow" id="pvPeriod"></span>
      <h1 id="pvTitle"></h1>
      <p id="pvFocus"></p>
    </header>
    <div class="stats" id="pvStats"></div>
    <div class="plan" id="pvPlan"></div>
    <div class="cta">
      <button class="btn ghost" id="pvAudio" type="button" data-i18n="pv.audio"></button>
      <button class="btn" id="pvStart" type="button" data-i18n="btn.start"></button>
    </div>
  </div>
</main>

<div id="player" hidden data-kind="gate">
  <div class="topbar">
    <div class="wrap">
      <div class="line">
        <button class="icon-btn" id="btnExit" type="button" data-i18n-aria="aria.exit">✕</button>
        <div class="where" id="where"></div>
        <button class="icon-btn" id="btnAudio" type="button" data-i18n-aria="audio.title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>
        <button class="icon-btn" id="btnList" type="button" data-i18n="list.title"></button>
      </div>
      <div class="track" id="track" aria-hidden="true"></div>
    </div>
  </div>
  <div class="wrap stage" id="stage"></div>
  <div class="bar">
    <div class="wrap">
      <button class="nav" id="btnPrev" type="button" data-i18n-aria="aria.prev">‹</button>
      <button class="btn" id="btnMain" type="button" data-i18n="btn.start"></button>
      <button class="nav" id="btnNext" type="button" data-i18n-aria="aria.next">›</button>
    </div>
  </div>
</div>

<main id="done" hidden>
  <div class="wrap">
    <span class="eyebrow" id="doneKicker"></span>
    <h1 class="done-mark" data-i18n-html="done.title"></h1>
    <div class="stats" id="doneStats"></div>
    <p id="doneMsg" style="color:var(--ink-2)"></p>
    <div id="doneDiary" hidden></div>
    <div class="cta"><button class="btn" id="doneHome" type="button" data-i18n="done.home"></button></div>
  </div>
</main>

<dialog id="dlgList"><div class="dlg">
  <header><h3 data-i18n="list.title"></h3><button class="icon-btn" type="button" data-close data-i18n="btn.close"></button></header>
  <div id="listBody"></div>
</div></dialog>

<dialog id="dlgAudio"><div class="dlg">
  <header><h3 data-i18n="audio.title"></h3><button class="icon-btn" type="button" data-close data-i18n="btn.close"></button></header>
  <div class="set-row"><div data-i18n="audio.beep"><small data-i18n="audio.beepHint"></small></div>
    <div class="seg" data-set="beep"><button type="button" data-v="1" data-i18n="btn.yes"></button><button type="button" data-v="0" data-i18n="btn.no"></button></div></div>
  <div class="set-row"><div data-i18n="audio.voice"><small data-i18n="audio.voiceHint"></small></div>
    <div class="seg" data-set="voice"><button type="button" data-v="1" data-i18n="btn.yes"></button><button type="button" data-v="0" data-i18n="btn.no"></button></div></div>
  <div class="set-row"><div data-i18n="audio.prep"><small data-i18n="audio.prepHint"></small></div>
    <div class="seg" data-set="prep"><button type="button" data-v="5">5</button><button type="button" data-v="10">10</button><button type="button" data-v="15">15</button></div></div>
  <p class="fine" data-i18n="audio.iosNote"></p>
</div></dialog>

<dialog id="dlgExit"><div class="dlg">
  <header><h3 data-i18n="exit.title"></h3></header>
  <p style="color:var(--ink-2)" data-i18n="exit.text"></p>
  <div class="row"><button class="btn ghost" type="button" data-close data-i18n="exit.stay"></button><button class="btn" id="exitYes" type="button" style="--phase:var(--ink);--on-phase:var(--bg)" data-i18n="exit.leave"></button></div>
</div></dialog>
<script>
/* WorkoutPlayer · utilità pure: formattazione e accesso al DOM. Da src/app1.js:19-26.
   Ogni file della libreria si registra sull'oggetto globale WorkoutPlayer; il punto d'ingresso è lib/index.js. */
(function (WP) {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); };
  const fmtKg = (v, sep) => String(v).replace(".", sep == null ? "," : sep); // separatore dei decimali della lingua (T2)
  const durText = sec => (sec >= 60 ? (sec % 60 ? fmt(sec) + " min" : sec / 60 + " min") : sec + " s");
  WP.modules = WP.modules || {};
  WP.util = { $, esc, fmt, fmtKg, durText };
})(globalThis.WorkoutPlayer = globalThis.WorkoutPlayer || {});
/* WorkoutPlayer · lingue (T2). Cinque lingue dell'interfaccia: IT, EN, FR, ES, DE, un file per lingua in lib/lang/<codice>.js

razos por encima de la cabeza con las manos entrelazadas.","Inclina el tronco hacia un lado sin rotar y sin llevar la cadera adelante o atrás.","Estira todo el costado, aguanta 1 segundo, vuelve al centro y cambia de lado.","Busca un poco más de amplitud en cada vuelta."]},"flexext":{"name":"Movilidad cadena flexo-extensión","it":"Flexo-extensión de cadenas","gear":"Esterilla","how":["Empieza sentado sobre los talones con las manos en el suelo delante de ti.","Empuja con las manos, estira las piernas y sube la cadera: V invertida, talones buscando el suelo.","Empuja el pecho hacia los muslos, aguanta 1 segundo en el estiramiento.","Flexiona las rodillas y vuelve a sentarte sobre los talones, luego repite con fluidez."]},"bbcross":{"name":"Extensión cruzada superman","it":"Extensiones cruzadas","gear":"Esterilla","how":["Tumbado boca abajo, brazos y piernas abiertos en X.","Levanta a la vez un brazo y la pierna opuesta estirando la diagonal, como si alguien tirara de tu mano y tu pie.","Aguanta un instante arriba, baja con control y pasa a la otra diagonal.","Cuello largo y mirada al suelo, glúteos activos: el movimiento nace de la espalda, no del impulso."]},"crosssit":{"name":"Crunch cruzado","it":"Crunch cruzado","gear":"Esterilla","how":["Boca arriba, brazos y piernas abiertos en X.","Levanta una pierna estirada y lleva la mano opuesta hacia el pie, despegando hombro y escápula del suelo.","Espira al subir, baja con control y alterna la diagonal.","La zona lumbar queda en contacto con el suelo durante todo el minuto."]},"cablechest":{"name":"Press de pecho en polea de pie","it":"Press en polea de pie","gear":"Poleas · altura 22","how":["Poleas a la altura 22. De espaldas a la máquina, un pie adelante, pies escalonados, tronco ligeramente inclinado.","Empieza con las agarraderas a los lados del pecho, codos abiertos bajo la línea de los hombros.","Empuja hacia delante hasta extender casi del todo los brazos, acercando las manos.","Vuelve despacio dejando que el pecho se abra bien: la ejecución debe ser amplia."]},"trxchest":{"name":"Press de pecho en TRX","it":"Flexiones en TRX","gear":"TRX","how":["De espaldas al anclaje, agarraderas en mano con brazos tendidos, cuerpo inclinado hacia delante y rígido como en una plancha.","Flexiona los codos y baja el pecho entre las manos: codos a unos 45° del tronco.","Empuja y vuelve con los brazos tendidos sin perder la alineación cabeza-cadera-talones.","Cuanto más atrás lleves los pies, más difícil es: elige una inclinación que te permita cerrar bien las 10 repeticiones."]},"reversefly":{"name":"Aperturas inversas en polea de pie","it":"Aperturas inversas en poleas","gear":"Poleas cruzadas","how":["De pie frente a las poleas, agarra el cable derecho con la mano izquierda y viceversa: brazos tendidos delante de ti.","Abre los brazos hacia fuera y atrás hasta la línea de los hombros, pulgares hacia atrás.","Aprieta las escápulas un instante, luego vuelve despacio sin dejar que el peso te arrastre.","Carga ligera y sin impulso del tronco: deben trabajar los deltoides posteriores."]},"situp":{"name":"Sit-up","it":"Sit-up","gear":"Esterilla · pies sujetos","how":["Boca arriba, rodillas flexionadas, pies fijados bajo un apoyo. Manos detrás de la nuca, codos abiertos.","Al espirar, sube el tronco hasta sentarte, despegando la espalda del suelo vértebra a vértebra.","Baja despacio, vértebra a vértebra.","Las manos solo apoyan: no tires del cuello."]},"latpull":{"name":"Jalón al pecho","it":"Jalón al pecho","gear":"Jalón al pecho","how":["Agarre prono (palmas al frente), un poco más ancho que los hombros. Fija los muslos bajo los rodillos.","Pecho alto, tronco ligeramente inclinado atrás: tira de la barra hacia la parte alta del pecho.","Guía con los codos hacia abajo y baja las escápulas, sin balancearte.","Sube controlando hasta tener los brazos casi extendidos."]},"pulley":{"name":"Remo sentado en polea","it":"Remo en polea baja","gear":"Polea","how":["Sentado, pies en los apoyos, rodillas echar el estiramiento del bíceps."]},"steady":{"name":"Cardio continuo","it":"Caminata / carrera continua","gear":"Cinta de correr o ruta al aire libre","how":["30 minutos sin parar, alternando caminata rápida y carrera.","Elige un ritmo que puedas mantener hasta el final: respiración exigida pero regular.","Si te falta el aire, vuelve a la caminata rápida un minuto y luego retoma.","Guarda algo de reserva: al final te esperan las 4 series de HIIT."]},"hiit":{"name":"HIIT","it":"Carrera al 90 % de la FC máx","gear":"Cinta de correr o ruta al aire libre","how":["2 minutos de carrera sostenida, hasta alcanzar cerca del 90 % de tu frecuencia cardíaca máxima.","Sube la velocidad en los primeros 20-30 segundos y luego mantenla: no arranques en sprint.","Zancada corta y rápida, hombros relajados, espiración completa.","Si tienes un pulsómetro, revisa las pulsaciones en el último minuto."]},"cooldown":{"name":"Vuelta a la calma","it":"Caminata de recuperación","gear":"Cinta de correr o ruta al aire libre","how":["Camina a paso tranquilo y deja bajar las pulsaciones.","Respira hondo por la nariz, espira largo por la boca.","Este bloque no está en tu ficha: es un consejo para cerrar bien después del HIIT. Puedes saltarlo."]}},"workouts":{"A":{"id":"A","title":"Entreno A","focus":"Pecho · Espalda · Abdomen","period":"del 10/09/26 al 18/10/26","phases":[{"id":"aerobica","title":"Cardio","kicker":"Calentamiento","notes":["Sube la intensidad de forma progresiva: 10 minutos mínimo.","El RPE es la escala de autoevaluación del esfuerzo percibido.","El día de pierna, evita correr.","En cualquier caso, evita un esfuerzo cardio excesivo."],"flow":"continuous","items":[{"ex":"treadmill","mode":"timed","dur":120,"rest":0,"sets":1,"label":"RPE 4","cue":"esfuerzo moderado: hablas sin problema","note":null},{"ex":"treadmill","mode":"timed","dur":120,"rest":0,"sets":1,"label":"RPE 5","cue":"algo exigente: hablas con frases completas","note":null},{"ex":"treadmill","mode":"timed","dur":120,"  && !(item.noRestAfterLast && set === sets)) steps.push(rest(at));\n      };\n      if (ph.flow === \"circuit\") {\n        for (let r = 1; r <= ph.rounds; r++) ph.items.forEach((_, ii) => add(ii, 1, 1, r));\n      } else {\n        ph.items.forEach((it, ii) => { for (let s = 1; s <= it.sets; s++) add(ii, s, it.sets, 0); });\n      }\n      // niente riposo a timer prima di una nuova fase o della fine: lì ci si ferma comunque\n      if (steps[steps.length - 1].type === \"rest\") steps.pop();\n    });\n    return steps;\n  }\n\n  const out = {};\n  Object.keys(plan.workouts).forEach(id => { out[id] = buildSteps(plan.workouts[id]); });\n  return out;\n}\n", lang: "es" });
