</script>
<style>
  /* ---------- Tokens and themes: copy of lib/tokens.css (source of the player's design system) ----------
     Only intended difference: --display lists the fallbacks sized like Barlow Condensed (below) before the system fallbacks. */
  :root {
    --bg: #ECEFEA; --surface: #FFFFFF; --surface-2: #E1E5DF; --line: #CFD5CD;
    --ink: #14181A; --ink-2: #49545A; --ink-3: #5F6A6F;

    --display: "Barlow Condensed", "BC fallback AN", "BC fallback HN", "BC fallback A", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;

  @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/barlow-condensed-600-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-condensed-700-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-condensed-700-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* ---------- Fonts: fallback sized like Barlow Condensed ----------
     Barlow Condensed may arrive after the first paint. Until then a narrow system font takes its place, scaled
     down with size-adjust just enough never to be wider than it (lowest width ratio measured line by line on the page's
     uppercase texts in the 5 languages: title lines and h2 for 700, buttons and audience titles for 600), so the title, the
     buttons and the header wrap at the same points and the page does not jump when the real font arrives; ascent and descent
     are set to Barlow Condensed's (1 and 0.2 em, divided by size-adjust), so the text stays at the same height too. One per
     system, the first one available: Arial Narrow (macOS, Windows with Office), Helvetica Neue Condensed (iOS), Arial or Roboto
     (the others). local() only: no network requests. Values and measurements in README.md, "Fonts and layout shift". */
  @font-face { font-family: "BC fallback AN"; src: local("Arial Narrow Bold"), local("ArialNarrow-Bold"); font-weight: 700; size-adjust: 81%; ascent-override: 123.5%; descent-override: 24.7%; line-gap-override: 0%; }
  @font-face { font-family: "BC fallback AN"; src: local("Arial Narrow Bold"), local("ArialNarrow-Bold"); font-weight: 600; size-adjust: 78.5%; ascent-override: 127.4%; descent-override: 25.5%; line-gap-override: 0%; }
  @font-face { font-family: "BC fallback HN"; src: local("HelveticaNeue-CondensedBold"), local("Helvetica Neue Condensed Bold"); font-weight: 700; size-adjust: 85%; ascent-override: 117.6%; descent-override: 23.5%; line-gap-override: 0%; }
  @font-face { font-family: "BC fallback HN"; src: local("HelveticaNeue-CondensedBold"), local("Helvetica Neue Condensed Bold"); font-weight: 600; size-adjust: 83.5%; ascent-override: 119.8%; descent-override: 24%; line-gap-override: 0%; }
  @font-face { font-family: "BC fallback A"; src: local("Arial Bold"), local("Arial-BoldMT"), local("Roboto Bold"), local("Roboto-Bold"); font-weight: 700; size-adjust: 66.5%; ascent-override: 150.4%; descent-override: 30.1%; line-gap-override: 0%; }
  @font-face { font-family: "BC fallback A"; src: local("Arial Bold"), local("Arial-BoldMT"), local("Roboto Bold"), local("Roboto-Bold"); font-weight: 600; size-adjust: 64%; ascent-override: 156.2%; descent-override: 31.2%; line-gap-override: 0%; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1113; --surface: #181D20; --surface-2: #232A2E; --line: #2E373B;
      --ink: #F0F3EE; --ink-2: #B1BBBF; --ink-3: #87939A;
      --work: #FF6B2C; --rest: #2CC7B0; --prep: #F0B429; --on-phase: #0E1113;
      --note-bg: #2B2410; --note-ink: #F6E3A6; --note-line: #6B5618;
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 17px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { text-wrap: balance; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--work); outline-offset: 2px; }
  ::selection { background: var(--work); color: var(--on-phase); }
  .wrap { max-width: 1040px; margin-inline: auto; padding-inline: 24px; }
  .num { font-variant-numeric: tabular-nums; }
  section { padding-block: 56px; }
  /* "Skip to content": the first element for keyboard users, off screen until it has focus; it leads to <main> */
  .skip {
    position: absolute; left: 8px; top: 8px; z-index: 60; padding: 12px 16px; border-radius: 6px;
    background: var(--ink); color: var(--bg); font: 600 16px/1 var(--body); text-decoration: none;
    transform: translateY(calc(-100% - 16px));
  }
  .skip:focus { transform: none; }
  main:focus { outline: none; }

  /* ---------- Barra superiore ---------- */
  .top { border-bottom: 1px solid var(--line); }
  .top-row { padding-block: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font: 700 20px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  /* Icona dell'app accanto al nome: stesso disegno di icons/favicon.svg; nel tema scuro un filo di bordo la stacca dal fondo. */
  .brand-mark { width: 28px; height: 28px; flex: none; display: block; border-radius: 6px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-mark { box-shadow: 0 0 0 1px var(--line); } }
  .langs { display: flex; gap: 4px; }
  .langs button {
    position: relative; min-width: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 5px 9px;
    font: 600 12.5px/1 var(--body); letter-spacing: .04em; color: var(--ink-2);
  }
  /* invisible touch area, 46 px tall and as wide as the button plus half the gap on each side: the header does not grow */
  .langs button::after { content: ""; position: absolute; inset: -11px -2px; }
  .langs button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  /* Below 600 px the header stays on one row (logo and name, languages). Language buttons are a fixed 30 px wide: the row has
     the same width with any font and does not wrap while Barlow has not arrived yet. */
  @media (max-width: 599px) {
    .top .wrap { padding-inline: 16px; }
    .top-row { padding-block: 10px; }
    .brand { font-size: 17px; gap: 8px; }
    .brand-mark { width: 24px; height: 24px; }
    .langs { gap: 3px; }
    .langs button { width: 30px; min-width: 0; padding: 5px 0; font-size: 12px; }
  }

  /* ---------- Hero ----------
     Sotto i 900 px, nell'ordine del markup: titolo, i due passi affiancati, prezzo e pulsanti (nella prima schermata),
     poi il testo introduttivo. Da 900 px: a sinistra titolo, testo e passi; a destra il prezzo con i pulsanti. */
  .hero .wrap { padding-block: 16px 8px; }
  .hero-head { text-align: center; max-width: 760px; margin-inline: auto; }
  /* product status above the title: an orange light and plain text, like the indicator light on a scoreboard */
  .status { display: flex; justify-content: center; align-items: center; gap: 8px; font: 600 15px/1.2 var(--body); color: var(--ink-2); }
  .status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--work); }
  .hero-head h1 {
    font: 700 clamp(27px, 5.2vw, 58px)/0.98 var(--display); text-transform: uppercase; letter-spacing: -.01em;
    margin-top: 8px;
  }
  .hero-intro { max-width: 560px; margin: 32px auto 0; text-align: center; }
  .hero-intro .lede { color: var(--ink-2); font-size: 18px; }
  .hero-intro .fine-print { color: var(--ink-3); font-size: 14.5px; margin-top: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 6px; padding: 15px 20px;
    font: 600 17px/1 var(--display); letter-spacing: .03em; text-transform: uppercase;
    background: var(--work); color: var(--on-phase); text-decoration: none;
  }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

  /* ---------- Price and buttons: on phones the price is a paragraph above the button, from 900 px a card on the right;
     below them, the three reasons to trust (on phones after the button, outside the first screen) ---------- */
  .offer { max-width: 420px; margin: 18px auto 0; text-align: center; }
  .price { color: var(--ink-2); font-size: 14px; line-height: 1.3; text-wrap: balance; }
  .price b { font: 700 20px/1 var(--display); color: var(--ink); }
  .price span::before { content: "· "; }
  .price strong { font-weight: 600; color: var(--ink); }
  .offer-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .offer .btn { justify-content: center; text-align: center; text-wrap: balance; }
  .reasons { list-style: none; max-width: 420px; margin: 24px auto 0; padding: 0; display: grid; gap: 10px; text-align: left; color: var(--ink-2); font-size: 15px; line-height: 1.4; }
  .reasons li { position: relative; padding-left: 18px; }
  .reasons li::before { content: ""; position: absolute; left: 0; top: .5em; width: 8px; height: 8px; border-radius: 2px; background: var(--work); }
  .reasons b { font-weight: 600; color: var(--ink); }

  /* ---------- Come funziona: due passi, dal foglio all'app ----------
     Un piccolo racconto, non una tabella: a sinistra i tre formati della scheda aperti a ventaglio (pagina PDF, foto della
     scheda scritta a mano, foglio di calcolo); a destra, un po' più in basso, il player sulla stessa scheda; una freccia fatta
     a mano va dal bordo del ventaglio a quello del telefono (la disegna lo script in fondo alla pagina e la ricalcola quando
     cambia l'impaginazione). Numero e titolo di ogni passo stanno sopra la sua immagine, allineati al suo bordo sinistro. */
  .steps {
    position: relative; list-style: none; margin: 18px 0 0; padding: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    --fig-h: clamp(165px, calc(54vw - 2px), 300px);
  }
  .step { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; text-align: left; }
  /* sul telefono il telefonino sta al bordo destro e il ventaglio prende il resto, meno una corsia di 82 px per la freccia */
  .step-1 { width: calc(100% - (var(--fig-h) - 24px) * .56 - 82px); }
  .step-2 { width: calc((var(--fig-h) - 24px) * .56); margin-top: 36px; }
  @media (max-width: 599px) { .steps { margin-inline: -8px; } }   /* i passi usano 8 px del margine della pagina per lato */
  .step-note { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 10px; }
  .step-n { font: 700 32px/0.8 var(--display); color: var(--work); }
  .step-label { font: 600 13.5px/1.25 var(--body); color: var(--ink); }
  .step-fig { margin: 0; width: 100%; }
  /* 1 · i tre formati a ventaglio, come carte in mano: dietro la pagina PDF e il foglio di calcolo, davanti la foto della
     scheda scritta a mano. Sono carta: colori fissi (i valori chiari di --work e --rest) anche nel tema scuro. */
  .fan { position: relative; aspect-ratio: 420 / 360; }
  .card { position: absolute; display: block; }
  .card svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 1px 1px rgba(0,0,0,.12)) drop-shadow(0 8px 12px rgba(0,0,0,.18)); }
  .card-pdf { left: 2%; top: 6%; width: 45%; transform: rotate(-12deg); }
  .card-sheet { left: 44%; top: 2%; width: 54%; transform: rotate(8deg); }
  .card-photo {
    left: 18%; top: 34%; width: 62%; transform: rotate(-3deg); padding: 3.2%; background: #FBFBF8; border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,.14), 0 12px 24px -10px rgba(0,0,0,.4);
  }
  .card-photo img { display: block; width: 100%; height: auto; }
  .card-tag { font: 700 30px var(--display); fill: #fff; letter-spacing: .04em; }
  /* la freccia fra i due passi: un tratto a mano, disegnato dallo script fra i bordi veri delle due immagini */
  .steps-arrow { position: absolute; inset: 0; pointer-events: none; }
  .steps-arrow svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .steps-arrow path { fill: none; stroke: var(--work); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: no-preference) {
    .steps-arrow.draw path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .8s ease-out; }
    .steps-arrow.draw path + path { transition-duration: .25s; transition-delay: .7s; }
    .steps-arrow.draw.drawn path { stroke-dashoffset: 0; }
  }
  /* 2 · il player sullo squat, immagine fissa nello stesso telefono della demo (cornice scura, bordo in titanio, isola, barra di
     stato), tagliato sotto 2/4 e 75 kg. La larghezza si ricava dall'altezza del riquadro, così 2/4 e 75 kg restano sopra la
     sfumatura; il resto è in proporzione al telefono della demo, largo 463: cornice 16,5, angoli 71,5 fuori e 55 dentro, isola
     126 × 37 a 11 dal bordo dello schermo, barra di stato 59. La cattura comincia sotto la barra, così l'isola non la copre. */
  .fig-phone {
    height: var(--fig-h); display: grid; place-items: start; overflow: hidden; overflow: clip;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 14px), transparent); mask-image: linear-gradient(#000 calc(100% - 14px), transparent);
  }
  .mini-phone {
    --pw: calc((var(--fig-h) - 24px) * .56);
    position: relative; width: var(--pw); margin-top: 2px; padding: calc(var(--pw) * .0356); border-radius: calc(var(--pw) * .1544);
    background: #08090A; box-shadow: inset 0 0 0 max(1px, calc(var(--pw) * .0076)) #43464B, 0 1px 2px rgba(0,0,0,.12), 0 16px 30px -14px rgba(0,0,0,.4);
  }
  .mini-phone::before {   /* l'isola */
    content: ""; position: absolute; top: calc(var(--pw) * .0594); left: 50%; translate: -50% 0; width: calc(var(--pw) * .2721); height: calc(var(--pw) * .0799);
    background: #000; border-radius: calc(var(--pw) * .04); z-index: 2;
  }
  .mini-phone picture { display: block; padding-top: calc(var(--pw) * .1274); background: var(--bg); border-radius: calc(var(--pw) * .1188); overflow: hidden; }
  .mini-phone img { width: 100%; height: auto; }
  /* ora e icone della barra di stato solo da 900 px, dove l'ora è alta 7 px e si legge; sotto resta la barra con l'isola */
  .mini-bar { display: none; }
  @media (min-width: 900px) {
    .mini-bar { display: block; position: absolute; top: calc(var(--pw) * .0356); left: calc(var(--pw) * .0356); right: calc(var(--pw) * .0356); height: calc(var(--pw) * .1274); color: var(--ink); z-index: 2; }
    .mini-bar .time { position: absolute; left: 0; top: 18.64%; width: 35.35%; height: 62.71%; display: grid; place-items: center; font: 600 calc(var(--pw) * .0367)/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mini-bar svg { position: absolute; left: 73.95%; top: 38.98%; width: 16.74%; height: 22.03%; }
  }
  /* Tema scuro: la carta si abbassa un poco e le ombre si fanno più scure, così le immagini non sembrano adesivi */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .fan { filter: brightness(.9); }
    :root:not([data-theme="light"]) .card svg { filter: drop-shadow(0 0 1px rgba(255,255,255,.08)) drop-shadow(0 10px 14px rgba(0,0,0,.6)); }
    :root:not([data-theme="light"]) .card-photo { box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 14px 26px -8px rgba(0,0,0,.75); }
    :root:not([data-theme="light"]) .mini-phone { box-shadow: inset 0 0 0 max(1px, calc(var(--pw) * .0076)) #43464B, 0 18px 34px -12px rgba(0,0,0,.8); }
  }

  /* ---------- Demo dal vivo: testo e un telefono vero con la demo dentro ----------
     Il telefono è un iPhone Pro Max: schermo 430 × 932 px CSS con angoli di 55, cornice di 16,5 (bordo in titanio compreso) con
     angoli di 71,5, isola 126 × 37 a 11 px dal bordo, barra di stato alta 59; sotto, la demo in un iframe di 430 × 873 che si
     impagina sempre così. Il telefono si scala tutto insieme con --s: 0,85 con la finestra da 410 px in su (su desktop è alto
     820 px come quello di prima, così la sezione non cresce), sotto quanto basta a stare nello schermo con 8 px ai lati:
     --s = (larghezza della finestra − 16 px) / 463 px, scritto tan(atan2(…)) perché in CSS una lunghezza non si divide per un'altra. */
  .demo { padding-block: 56px 0; --s: .65; }   /* senza tan()/atan2(): sta anche in 320 px */
  @supports (scale: tan(atan2(1px, 1px))) { .demo { --s: min(.85, tan(atan2(100vw - 16px, 463px))); } }
  .demo .wrap { display: flex; flex-direction: column; gap: 28px; }
  .demo-text h2 { font: 700 clamp(28px, 4vw, 40px)/1.02 var(--display); text-transform: uppercase; letter-spacing: -.005em; }
  .demo-text p { color: var(--ink-2); margin-top: 12px; max-width: 46ch; }
  .demo-text a { display: inline-block; margin-top: 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .demo-text .demo-note { color: var(--ink-3); font-size: 14px; margin-top: 10px; }
  .demo-phone { display: flex; justify-content: center; }
  .phone {
    position: relative; flex: none; width: calc(463px * var(--s)); padding: calc(16.5px * var(--s)); border-radius: calc(71.5px * var(--s));
    background: #08090A; box-shadow: inset 0 0 0 calc(3.5px * var(--s)) #43464B, 0 30px 60px -30px rgba(0,0,0,.35);
  }
  /* tasti laterali: a sinistra azione, volume su e giù; a destra accensione */
  .phone::before, .phone::after { content: ""; position: absolute; width: calc(3px * var(--s)); background: #43464B; }
  .phone::before {
    right: 100%; top: calc(186px * var(--s)); height: calc(217px * var(--s)); border-radius: 2px 0 0 2px;
    background: linear-gradient(#43464B 0 calc(30px * var(--s)), transparent 0 calc(76px * var(--s)), #43464B 0 calc(137px * var(--s)), transparent 0 calc(156px * var(--s)), #43464B 0);
  }
  .phone::after { left: 100%; top: calc(293px * var(--s)); height: calc(99px * var(--s)); border-radius: 0 2px 2px 0; }
  .screen {
    position: relative; width: calc(430px * var(--s)); height: calc(932px * var(--s)); border-radius: calc(55px * var(--s));
    overflow: hidden; overflow: clip; background: var(--bg);
  }
  /* dentro lo schermo tutto è in px veri del telefono (430 × 932) e si scala insieme */
  .screen-inner { position: relative; width: 430px; height: 932px; transform: scale(var(--s)); transform-origin: 0 0; }
  .status-bar { position: relative; height: 59px; color: var(--ink); }
  .status-bar .time { position: absolute; left: 0; top: 11px; width: 152px; height: 37px; display: grid; place-items: center; font: 600 17px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .status-bar .island { position: absolute; left: 152px; top: 11px; width: 126px; height: 37px; border-radius: 19px; background: #000; }
  .status-bar svg { position: absolute; left: 318px; top: 23px; width: 72px; height: 13px; }
  .screen iframe { display: block; width: 430px; height: 873px; border: 0; }
  /* Below 600 px the phone shows a still image of the demo home (page language and theme) that opens the fullscreen demo on
     tap: no scrolling inside the scrolling page, and a phone never downloads the demo. The live demo only from 600 px. */
  .demo-shot { display: none; }
  .demo-shot:focus-visible { outline-offset: -8px; }
  /* the invite, part of the same link: in the empty space under the home's last line (at least 109 phone px in every
     language), above the home bar; absolutely positioned, so it moves nothing */
  .demo-shot-hint {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); white-space: nowrap; padding: 10px 18px;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font: 600 18px/1 var(--body);
  }
  @media (max-width: 599px) {
    .screen iframe { display: none; }
    .demo-shot, .demo-shot img { display: block; width: 430px; height: 873px; }
    .demo-shot { position: relative; text-decoration: none; }
  }
  .home-bar { position: absolute; left: 143px; bottom: 8px; width: 144px; height: 5px; border-radius: 3px; background: var(--ink); pointer-events: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .phone { box-shadow: inset 0 0 0 calc(3.5px * var(--s)) #43464B, 0 30px 60px -30px rgba(0,0,0,.6); }
  }

  /* ---------- 600–899 px (tablet, impaginazione ancora in colonna): il ventaglio non supera i 380 px, fra i due passi restano
     90 px per la freccia e il telefono scende quanto basta perché la freccia arrivi su SQUAT poco sotto la metà del ventaglio ---------- */
  @media (min-width: 600px) and (max-width: 899px) {
    .steps { justify-content: center; gap: 90px; }
    .step-1 { width: min(50%, 380px); }
    .step-2 { width: min(30%, 240px); margin-top: calc(min(50%, 380px) * .41 - 56px); }   /* SQUAT poco sotto la metà del ventaglio */
  }

  /* ---------- ≥ 900 px: title and text top left, the price card top right with the three reasons below it; below, the two
     steps centred on the page. The text row is flexible: if the right column is taller, the extra space goes below the text,
     not between title and text. The title does not break where the dictionary says ("\n"): text-wrap: balance splits it, so
     the last word is never left alone on a line. ---------- */
  @media (min-width: 900px) {
    .hero .wrap {
      padding-block: 44px 8px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; column-gap: 48px; align-items: start;
      grid-template-rows: auto 1fr auto; grid-template-areas: "head offer" "intro offer" "steps steps";
    }
    .hero-head { grid-area: head; text-align: left; max-width: none; margin-inline: 0; }
    .status { justify-content: flex-start; }
    .hero-head h1 br { display: none; }
    .hero-intro { grid-area: intro; text-align: left; max-width: 560px; margin: 24px 0 0; }
    .hero-aside { grid-area: offer; align-self: start; margin-top: 4px; }
    .offer {
      max-width: none; margin: 0; text-align: left;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px;
    }
    .price b { display: block; font-size: 56px; line-height: .9; }
    .price span { display: block; margin-top: 8px; font-size: 15px; }
    .price span::before { content: none; }
    .price strong { display: block; margin-top: 2px; font-size: 15px; }
    .offer-actions { margin-top: 20px; }
    .reasons { max-width: none; margin: 24px 0 0; }
    .offer .btn { font-size: 16px; padding: 14px 16px; line-height: 1.15; }
    .steps { grid-area: steps; margin-top: 64px; justify-content: center; gap: 110px; --fig-h: 360px; }
    .step-1 { width: 380px; }
    .step-2 { width: 260px; margin-top: 72px; }
    .step-note { flex-direction: row; align-items: center; gap: 14px; margin-bottom: 14px; }
    .step-n { font-size: 64px; }
    .step-label { font-size: 17px; max-width: 210px; }
    .steps-arrow path { stroke-width: 3; }
    .demo { padding-top: 72px; }
    /* the demo text starts at the top, next to the phone (not halfway down its height) */
    .demo .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 56px; align-items: start; border-top: 1px solid var(--line); padding-top: 64px; }
    .demo-text { padding-top: 24px; }
  }
  @media (min-width: 1100px) {
    .hero .wrap { grid-template-columns: minmax(0, 1fr) 340px; column-gap: 56px; }
    .steps { gap: 150px; --fig-h: 400px; }
    .step-1 { width: 440px; }
    .step-2 { width: 280px; margin-top: 84px; }
  }

  /* ---------- Pubblici ---------- */
  .aud-head { max-width: 56ch; }
  .aud-head h2 {
    font: 700 clamp(28px, 4vw, 40px)/1.02 var(--display); text-transform: uppercase; letter-spacing: -.005em;
  }
  .aud-lede { color: var(--ink-2); font-size: 18px; margin-top: 10px; }
  .aud-list { margin-top: 28px; }
  /* two rows without numbers: who trains with a plan, the professionals who write it */
  .aud { padding-block: 22px; border-top: 1px solid var(--line); }
  .aud:last-child { border-bottom: 1px solid var(--line); }
  .aud h3 { font: 600 21px/1.2 var(--display); text-transform: uppercase; letter-spacing: .01em; margin-bottom: 5px; text-wrap: balance; }
  .aud p { color: var(--ink-2); font-size: 15.5px; max-width: 60ch; }
  .aud .case { color: var(--ink-3); font-size: 14px; margin-top: 6px; }

  /* ---------- Early access, #manda-scheda (shown only if the language shown has a form: UPLOAD_FORM_URLS or UPLOAD_FORM_URL) ----------
     Full-width dark band in both themes: the Tally form uses its dark theme and sits on it without a frame.
     The section redefines the tokens with the dark values, so texts, warning, links and focus get the right colours by themselves. */
  .upload {
    --bg: #181D20; --surface: #232A2E; --surface-2: #2B3337; --line: #2E373B;
    --ink: #F0F3EE; --ink-2: #B1BBBF; --ink-3: #87939A;
    --work: #FF6B2C; --on-phase: #0E1113;
    --note-bg: #2B2410; --note-ink: #F6E3A6; --note-line: #6B5618;
    background: var(--bg); color: var(--ink);
    padding-block: 56px 48px;
    /* copre il filo del piè di pagina: sotto la fascia il passaggio al piè di pagina è il suo bordo, pulito in tutti e due i temi */
    position: relative; margin-bottom: -1px;
  }
  @media (prefers-color-scheme: dark) {
    /* Nel tema scuro la pagina è #0E1113: la fascia resta un gradino più chiara, con un filo sopra e uno sotto. */
    :root:not([data-theme="light"]) .upload { border-block: 1px solid var(--line); }
  }
  .upload h2 {
    font: 700 clamp(32px, 5vw, 56px)/.98 var(--display); text-transform: uppercase; letter-spacing: -.005em;
  }
  .upload-body { color: var(--ink-2); max-width: 46ch; margin-top: 14px; font-size: 18px; text-wrap: pretty; }
  .upload-optional { color: var(--ink-2); max-width: 52ch; margin-top: 10px; font-size: 16px; text-wrap: pretty; }
  /* personal data warning: a box with a thin border, without the bar on the left */
  .upload-warn {
    max-width: 520px; margin-top: 24px; padding: 12px 14px; border-radius: 6px; font-size: 15px; font-weight: 500;
    background: var(--note-bg); color: var(--note-ink); border: 1px solid var(--note-line);
  }
  .upload-safe { color: var(--ink-2); max-width: 520px; margin-top: 10px; font-size: 14.5px; text-wrap: pretty; }
  /* No frame: the form (transparent background) blends into the band. Tally has 8 px of inner margin on the sides: the
     negative margin aligns the fields with the text edge. Until the form has arrived, "Carico il modulo…" shows at the top. */
  .upload-embed { position: relative; max-width: 536px; margin: 4px -8px 0; }
  .upload-embed iframe { display: block; max-width: 100%; }
  .upload-wait { position: absolute; top: 20px; left: 8px; right: 8px; color: var(--ink-2); font-size: 15px; }
  .upload-fallback { color: var(--ink-3); font-size: 14px; margin-top: 8px; }
  @media (min-width: 900px) { .upload { padding-block: 88px 80px; } }
  @media (min-width: 1000px) {
    /* Two columns from 1000 px (below that the text column would be narrow and the title would wrap): title, texts, warning
       and reassurance on the left; the form on the right. The flexible last row keeps the form's height from widening the gaps
       between the texts. */
    .upload .wrap {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px); grid-template-rows: repeat(5, auto) 1fr;
      column-gap: 72px; align-items: start;
    }
    .upload .wrap > * { grid-column: 1; }
    .upload .upload-embed { grid-column: 2; grid-row: 1 / 7; max-width: none; margin: 0 -8px; }
    .upload .upload-fallback { grid-column: 2; grid-row: 7; }
  }

  /* ---------- Piè di pagina ---------- */
  footer { border-top: 1px solid var(--line); }
  .legal { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding-block: 36px; }
  .legal h3 { font: 600 13px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .legal p { color: var(--ink-2); font-size: 14px; line-height: 1.55; }
  .legal p + p { margin-top: 8px; }
  @media (max-width: 640px) { .legal { grid-template-columns: 1fr; } }
  .linklike { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  #consentPrefs { min-height: 24px; }
  /* privacy notice, collapsed by default: the summary is the column heading with a chevron */
  .privacy summary { display: flex; align-items: center; gap: 10px; min-height: 24px; margin-top: -4px; cursor: pointer; list-style: none; }
  .privacy summary::-webkit-details-marker { display: none; }
  .privacy summary::after { content: ""; flex: none; width: 7px; height: 7px; margin-top: -4px; border: solid var(--ink-3); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .privacy[open] summary::after { margin-top: 3px; transform: rotate(-135deg); }
  .legal .privacy summary h3 { margin-bottom: 0; }
  .privacy[open] summary { margin-bottom: 8px; }
  .legal .prefs { margin-top: 12px; }

  /* ---------- Analytics banner: at the bottom, not modal, it appears only after the first scroll or the first tap (not the one on
     «Prenota»). «Rifiuta» and «Accetta» look the same: neither is emphasised. A border, no shadow. It never covers the Tally
     form: when the form passes under it, it steps aside (.away) and comes back once the form has gone by. ---------- */
  .consent {
    position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 50; max-width: 720px; margin-inline: auto;
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  }
  .consent[hidden] { display: none; }
  .consent.away { visibility: hidden; }
  .consent-text { flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 1.25; color: var(--ink-2); }
  .consent-text a { color: var(--ink); text-underline-offset: 2px; }
  .consent-actions { flex: none; display: flex; gap: 8px; }
  .consent-btn {
    min-height: 40px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--ink-3); background: transparent; color: var(--ink);
    font: 600 13.5px/1 var(--display); letter-spacing: .03em; text-transform: uppercase;
  }
  .consent-btn:hover { background: var(--surface-2); }
  @media (prefers-color-scheme: dark) {
    /* nel tema scuro un gradino più chiaro della fascia di «Accesso anticipato» (#181D20), così si stacca anche sopra di lei */
    :root:not([data-theme="light"]) .consent { background: var(--surface-2); border-color: #4A555B; }
    :root:not([data-theme="light"]) .consent-btn:hover { background: #2B3337; }
  }
</style>
</head>
<body>

<a class="skip" href="#content" data-i18n="skipLink"></a>

<header class="top">
  <div class="wrap top-row">
    <span class="brand"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="22" fill="#0E1113"/><g fill="#FF6B2C"><rect x="32" y="19" width="14" height="62" rx="4.5"/><rect x="50" y="29" width="13" height="42" rx="4.5"/><rect x="67" y="39" width="12" height="22" rx="4.5"/></g></svg>WorkoutPlayer</span>
    <!-- each language is named in that language (lang and aria-label), the same on every page: not in the dictionary -->
    <nav class="langs" id="langNav">
      <button type="button" data-lang="it" lang="it" aria-label="Italiano">IT</button>
      <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
      <button type="button" data-lang="fr" lang="fr" aria-label="Français">FR</button>
      <button type="button" data-lang="es" lang="es" aria-label="Español">ES</button>
      <button type="button" data-lang="de" lang="de" aria-label="Deutsch">DE</button>
    </nav>
  </div>
</header>

<main id="content" tabindex="-1">
<div class="hero">
  <div class="wrap">
    <div class="hero-head">
      <p class="status" data-i18n="heroStatus"></p>
      <h1 data-i18n="heroTitle"></h1>
    </div>

    <!-- Come funziona: due passi, dal foglio all'app (img/, vedi README): il ventaglio dei formati, la freccia, il player.
         La freccia la disegna lo script in fondo alla pagina. La demo dal vivo è nella sezione #demo qui sotto. -->
    <ol class="steps">
      <li class="step step-1">
        <p class="step-note"><span class="step-n num">1</span><span class="step-label" data-i18n="step1"></span></p>
        <figure class="step-fig fan">
          <span class="card card-pdf" aria-hidden="true">
            <svg viewBox="0 0 190 253" focusable="false">
              <path d="M7 1h137l45 45v199a6 6 0 0 1-6 6H7a6 6 0 0 1-6-6V7a6 6 0 0 1 6-6z" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="1.5"/>
              <path d="M144 1v39a6 6 0 0 0 6 6h39" fill="#EEF0EB" stroke="#D3D8D0" stroke-width="1.5" stroke-linejoin="round"/>
              <rect x="16" y="16" width="72" height="34" rx="5" fill="#C9430A"/>
              <text class="card-tag" x="52" y="43" text-anchor="middle">PDF</text>
              <rect x="16" y="66" width="160" height="16" rx="2" fill="#E9ECE6"/>
              <g fill="#C8CEC5"><rect x="20" y="94" width="68" height="7" rx="2"/><rect x="112" y="94" width="16" height="7" rx="2"/><rect x="136" y="94" width="14" height="7" rx="2"/><rect x="158" y="94" width="14" height="7" rx="2"/><rect x="20" y="116" width="54" height="7" rx="2"/><rect x="112" y="116" width="16" height="7" rx="2"/><rect x="136" y="116" width="14" height="7" rx="2"/><rect x="158" y="116" width="14" height="7" rx="2"/><rect x="20" y="138" width="76" height="7" rx="2"/><rect x="112" y="138" width="16" height="7" rx="2"/><rect x="136" y="138" width="14" height="7" rx="2"/><rect x="158" y="138" width="14" height="7" rx="2"/><rect x="20" y="160" width="60" height="7" rx="2"/><rect x="112" y="160" width="16" height="7" rx="2"/><rect x="136" y="160" width="14" height="7" rx="2"/><rect x="158" y="160" width="14" height="7" rx="2"/><rect x="20" y="182" width="48" height="7" rx="2"/><rect x="112" y="182" width="16" height="7" rx="2"/><rect x="136" y="182" width="14" height="7" rx="2"/><rect x="158" y="182" width="14" height="7" rx="2"/><rect x="20" y="204" width="70" height="7" rx="2"/><rect x="112" y="204" width="16" height="7" rx="2"/><rect x="136" y="204" width="14" height="7" rx="2"/><rect x="158" y="204" width="14" height="7" rx="2"/><rect x="20" y="226" width="58" height="7" rx="2"/><rect x="112" y="226" width="16" height="7" rx="2"/><rect x="136" y="226" width="14" height="7" rx="2"/><rect x="158" y="226" width="14" height="7" rx="2"/></g>
              <path d="M16 106h160M16 128h160M16 150h160M16 172h160M16 194h160M16 216h160M16 238h160" stroke="#E9ECE6" stroke-width="1.2"/>
            </svg>
          </span>
          <span class="card card-sheet" aria-hidden="true">
            <svg viewBox="0 0 230 177" focusable="false">
              <rect x="1" y="1" width="228" height="175" rx="5" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="1.5"/>
              <path d="M1 6a5 5 0 0 1 5-5h218a5 5 0 0 1 5 5v18H1z" fill="#0A8070"/>
              <rect x="1" y="24" width="228" height="22" fill="#0A8070" opacity=".14"/>

  var SUPPORTED = ["it", "en", "fr", "es", "de"];

  function detectLang() {
    var params = new URLSearchParams(location.search);

    if (SUPPORTED.indexOf(qLang) !== -1) return qLang;
    var hashLang = location.hash.replace("#", "").toLowerCase();
    if (SUPPORTED.indexOf(hashLang) !== -1) return hashLang;
    try {
      var saved = localStorage.getItem("wp-lang");

      if (SUPPORTED.indexOf(code) !== -1) return code;

    return DEFAULT_LANG;
  }

    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

      var key = el.getAttribute("data-i18n");
      var val = dict[key] != null ? dict[key] : fallback[key];
      if (val == null) return;
      // the space before <br> keeps the words apart where the CSS hides the line break (the title from 900 px)
      el.innerHTML = escapeHtml(val.replace("{ga4}", GA.cookie())).split("\n").join(" <br>");
    });
    document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-title");

    });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-aria");

    var imgLang = DICT[lang] ? lang : DEFAULT_LANG;
    [["data-lang-src", "src"], ["data-lang-srcset", "srcset"]].forEach(function (a) {
      document.querySelectorAll("[" + a[0] + "]").forEach(function (el) {
        var v = el.getAttribute(a[0]).replace("{lang}", imgLang);

  /* Freccia fra i due passi: va dal bordo destro del ventaglio al bordo sinistro del telefono, con una curva fatta a mano.
     Si ricalcola quando cambia l'impaginazione (larghezza, lingua, caratteri e immagini caricati). Le carte del ventaglio sono
     ruotate: la freccia parte dal loro lato destro vero, all'altezza di partenza, non dal riquadro che le contiene. */
  function drawStepsArrow() {

    if (!ol) return;
    var box = ol.getBoundingClientRect(), cards = ol.querySelectorAll(".fan .card"), top = Infinity, bottom = -Infinity, right = -Infinity;
    cards.forEach(function (c) { var r = c.getBoundingClientRect(); top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom); right = Math.max(right, r.right); });

      var w = c.offsetWidth / 2, v = (y - (r.top + r.bottom) / 2 - w * Math.sin(t)) / Math.cos(t);
      if (Math.abs(v) <= c.offsetHeight / 2) edge = Math.max(edge, (r.left + r.right) / 2 + w * Math.cos(t) - v * Math.sin(t));
    });
    var fig = ol.querySelector(".fig-phone").getBoundingClientRect(), ph = ol.querySelector(".mini-phone").getBoundingClientRect();
    var n = function (v) { return Math.round(v * 10) / 10; };

    if (small) {
      /* sotto i 900 px: dal ventaglio a metà altezza al bordo del telefono all'altezza di SQUAT, con una curva ampia che sale
         appena e scende morbida (tangenti a −38° e +15° dalla corda, al massimo 42° in arrivo); punta di 11 px ben aperta */
      var im = ol.querySelector(".mini-phone img").getBoundingClientRect();
      sx = (isFinite(edge) ? edge : right) - box.left + 6; ex = ph.left - box.left - 7; ey = im.top + im.width * 162 / 390 - box.top;
      var phi = Math.atan2(ey - sy, ex - sx), k = Math.hypot(ex - sx, ey - sy) * 0.42, ts = phi - 0.66;

    }
    paths[0].setAttribute("d", "M" + n(sx) + " " + n(sy) + "C" + n(c1x) + " " + n(c1y) + " " + n(c2x) + " " + n(c2y) + " " + n(ex) + " " + n(ey));
    paths[1].setAttribute("d", "M" + n(ex - len * Math.cos(a - open)) + " " + n(ey - len * Math.sin(a - open)) + "L" + n(ex) + " " + n(ey) +
      "L" + n(ex - len * Math.cos(a + open)) + " " + n(ey - len * Math.sin(a + open)));
    revealStepsArrow();
  }
  /* Entrando nello schermo la freccia si disegna, solo se il sistema non chiede meno movimento: quando lei è tutta nella
     finestra, non quando lo è una parte dei passi (su desktop, al caricamento, i passi si vedono a metà ma la freccia sì). */
  function revealStepsArrow() {
    var arrow = document.querySelector(".steps-arrow.draw:not(.drawn)"), path = arrow && arrow.querySelector("path");
    if (!path || !path.getAttribute("d")) return;
    var r = path.getBoundingClientRect();
    if (r.top < 0 || r.bottom > innerHeight) return;
    arrow.classList.add("drawn");
    removeEventListener("scroll", revealStepsArrow);
    removeEventListener("resize", revealStepsArrow);
  }
  (function () {
    if ("ResizeObserver" in window) {
      var ro = new ResizeObserver(drawStepsArrow);
      document.querySelectorAll(".steps, .fan, .fig-phone").forEach(function (el) { ro.observe(el); });
    }
    window.addEventListener("load", drawStepsArrow);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawStepsArrow);
    var arrow = document.querySelector(".steps-arrow");
    if (!arrow || !matchMedia("(prefers-reduced-motion: no-preference)").matches) return;
    arrow.classList.add("draw");
    addEventListener("scroll", revealStepsArrow, { passive: true });
    addEventListener("resize", revealStepsArrow);
  })();

  /* ---------- Analytics: Google Analytics 4 only with consent (consent mode v2 "basic") ----------
     Without GA_MEASUREMENT_ID (at the top of the page) nothing happens. With the ID:
     - consent starts denied for everything (analytics_storage, ad_storage, ad_user_data, ad_personalization) and gtag.js loads
       only after «Accetta»: no request to Google before that. No Google Signals, no ad personalisation; 13-month cookies
       (390 days) that are not extended on every visit;
     - the banner appears on the first scroll past 160 px or the first tap on a button or link (not the one on «Prenota», nor the
       jump to the form that follows it), never on load above «Prenota», and it never covers the Tally form (it steps aside
       while the form passes under it); «Preferenze cookie» in the footer reopens it. The choice lasts 6 months (localStorage);
       withdrawing consent denies it, switches the tag off and deletes the _ga* cookies;
     - the automatic page view and every event carry page_lang (updated if you change language); the events (cta_prenota,
       cta_demo with cta_position hero | demo, demo_interazione, iscrizione, cta_prenota_demo_bar) fire from the shared hooks
       further down. */
  var GA = (function () {
    var id = String(GA_MEASUREMENT_ID || "").trim();
    if (!/^G-[A-Z0-9]{4,}$/.test(id)) return { lang: function () {}, cookie: function () { return "_ga_…"; }, track: function () { return false; } };
    var KEY = "wp-statistiche", SEI_MESI = 182 * 864e5;
    var CONF = { allow_google_signals: false, allow_ad_personalization_signals: false, cookie_expires: 390 * 86400, cookie_update: false };
    // page_lang va nella configurazione: GA4 lo manda con ogni evento (con «set» non arriva); si riconfigura se cambi lingua
    function config(extra) { var c = {}, k; for (k in CONF) c[k] = CONF[k]; for (k in extra) c[k] = extra[k]; gtag("config", id, c); }
    var on = false, loaded = false, lang = detectLang();
    var banner = document.getElementById("consent");
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag("consent", "default", { analytics_storage: "denied", ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied" });

    function read() {
      try {
        var v = JSON.parse(localStorage.getItem(KEY));
        return v && (v.s === "granted" || v.s === "denied") && Date.now() - v.t < SEI_MESI ? v.s : null;
      } catch (e) { return null; }
    }
    function write(s) { try { localStorage.setItem(KEY, JSON.stringify({ s: s, t: Date.now() })); } catch (e) {} }
    function clearCookies() {   // anche sui domini superiori, dove GA li mette con cookie_domain "auto"
      document.cookie.split(";").forEach(function (c) {
        var name = c.split("=")[0].trim(), parts = location.hostname.split(".");
        if (!/^_ga/.test(name)) return;
        for (var i = 0; i < parts.length; i++) document.cookie = name + "=; Max-Age=0; path=/; domain=" + parts.slice(i).join(".");
        document.cookie = name + "=; Max-Age=0; path=/";
      });
    }
    function grant() {
      window["ga-disable-" + id] = false;
      on = true;
      gtag("consent", "update", { analytics_storage: "granted" });
      if (loaded) return;
      loaded = true;
      gtag("js", new Date());
      config({ page_lang: lang });
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
      document.head.appendChild(s);
    }
    function deny() {
      if (on) gtag("consent", "update", { analytics_storage: "denied" });
      on = false;
      window["ga-disable-" + id] = true;
      clearCookies();
    }
    function track(name, params) { if (!on) return false; gtag("event", name, params || {}); return true; }   // solo col consenso
    // The banner never covers the Tally form: when the form passes under it, it steps aside (.away: invisible and out of the
    // Tab order) and comes back once the form has gone by. Rechecked on scroll, on resize and when the form changes height
    // (Tally makes it taller when it arrives).
    var form = document.querySelector("#manda-scheda .upload-embed"), queued = false;
    function place() {
      queued = false;
      if (banner.hidden || !form) return;
      var f = form.getBoundingClientRect(), b = banner.getBoundingClientRect();
      banner.classList.toggle("away", f.height > 0 && f.top < b.bottom && f.bottom > b.top && f.left < b.right && f.right > b.left);
    }
    function queue() { if (!queued) { queued = true; requestAnimationFrame(place); } }
    addEventListener("scroll", queue, { passive: true });
    addEventListener("resize", queue);
    if (form && "ResizeObserver" in window) new ResizeObserver(queue).observe(form);
    function show() {
      if (!banner.hidden) return;
      banner.hidden = false;
      place();
      document.body.style.paddingBottom = banner.offsetHeight + 16 + "px";   // il fondo della pagina resta raggiungibile
    }
    function hide() { banner.hidden = true; document.body.style.paddingBottom = ""; }

    document.querySelectorAll("[data-ga-only]").forEach(function (el) { el.hidden = false; });
    banner.addEventListener("click", function (e) {
      var b = e.target.closest("[data-consent]");
      if (!b) return;
      write(b.getAttribute("data-consent"));
      hide();
      if (b.getAttribute("data-consent") === "granted") grant(); else deny();
    });
    document.getElementById("consentPrefs").addEventListener("click", function () {
      show();
      banner.querySelector("[data-consent]").focus();
    });

    var scelta = read();
    if (scelta === "granted") grant();
    else {
      clearCookies();   // senza un consenso valido non restano cookie _ga*
      if (scelta === null) {
        // the tap on «Prenota» does not bring it up, nor does the jump to the form that follows (scrolling does not count for one
        // second): it appears on the next real scroll, and stays aside while the form passes under it
        var quietUntil = 0;
        var onScroll = function () { if (window.scrollY > 160 && Date.now() > quietUntil) arm(); };
        var onTap = function (e) {
          if (!e.target.closest || !e.target.closest("a, button") || e.target.closest("#consent")) return;
          if (e.target.closest('a[href="#manda-scheda"]')) { quietUntil = Date.now() + 1000; return; }
          arm();
        };
        var arm = function () {
          removeEventListener("scroll", onScroll);
          document.removeEventListener("click", onTap, true);
          show();
        };
        addEventListener("scroll", onScroll, { passive: true });
        document.addEventListener("click", onTap, true);
      }
    }

    return {
      // cambio di lingua: gli eventi dopo portano la lingua nuova; la pagina vista la conta GA da sé, perché l'indirizzo cambia
      // (?lang=) e la misurazione avanzata conta i cambi di pagina della cronologia (vedi README)
      lang: function (l) { if (l === lang) return; lang = l; if (on) config({ page_lang: l, send_page_view: false }); },
      cookie: function () { return "_ga_" + id.slice(2); },
      track: track
    };
  })();

  /* ---------- Visite senza cookie: GoatCounter, sempre, senza consenso (niente cookie né dati personali) ----------
     Senza GOATCOUNTER_CODE non succede niente. Con il codice: count.js (https://gc.zgo.at/count.js, con data-goatcounter =
     https://<codice>.goatcounter.com/count) conta la visita una volta al caricamento, col percorso della lingua mostrata
     (/it, /en, …) e un titolo chiaro; cambiare lingua dal selettore non riconta. Gli eventi passano da
     goatcounter.count({ path, title, event: true }); se count.js non è ancora arrivato aspettano in coda.
     Fonte: goatcounter.com/help/start (come si incorpora), goatcounter.com/code/js e /code/path (window.goatcounter con path e
     title prima di count.js, count()), goatcounter.com/code/events (eventi: nome senza «/» iniziale). */
  var GC = (function () {
    var code = String(GOATCOUNTER_CODE || "").trim().toLowerCase();
    if (!/^[a-z0-9][a-z0-9-]*$/.test(code)) return { count: function () {} };
    var lang = detectLang(), coda = [];
    var LINGUE = { it: "italiano", en: "inglese", fr: "francese", es: "spagnolo", de: "tedesco" };
    window.goatcounter = { path: "/" + lang, title: "Landing WorkoutPlayer · " + (LINGUE[lang] || lang) };
    function pronto() { return !!window.goatcounter && typeof window.goatcounter.count === "function"; }
    function manda(v) { try { window.goatcounter.count(v); } catch (err) {} }
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://gc.zgo.at/count.js";
    s.setAttribute("data-goatcounter", "https://" + code + ".goatcounter.com/count");
    s.onload = function () { if (pronto()) while (coda.length) manda(coda.shift()); };
    document.body.appendChild(s);
    document.querySelectorAll("[data-gc-only]").forEach(function (el) { el.hidden = false; });
    return {
      count: function (name, title) {
        var v = { path: name, title: title, event: true };
        if (pronto()) manda(v); else if (coda.length < 20) coda.push(v);
      }
    };
  })();

  /* ---------- Early access form: the one for the language shown ----------
     UPLOAD_FORM_URLS[language], otherwise UPLOAD_FORM_URL (at the top of the page). render() calls it on every language change:
     if the form is the same nothing happens; if it changes, the iframe is replaced with a new one (Tally sets up an iframe only
     once) and "Carico il modulo…" shows again until the new form has arrived. Without a form for the language the section is
     hidden. The loader is Tally's official one (tally.so/widgets/embed.js; if it does not load, the iframe gets its address
     directly): it runs with the first language, once the iframe already has its data-tally-src. */
  var UPLOAD = (function () {
    var sec = document.getElementById("manda-scheda"), wait = sec.querySelector(".upload-wait"), current = null, tallyFailed = false;
    var TALLY_JS = "https://tally.so/widgets/embed.js";
    function formId(url) { var m = /^https:\/\/(?:www\.)?tally\.so\/(?:r|embed)\/([\w-]+)/.exec(String(url || "").trim()); return m && m[1]; }
    function fill() { document.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function (f) { f.src = f.dataset.tallySrc; }); }
    function loadTally() {
      if (typeof Tally !== "undefined") Tally.loadEmbeds();
      else if (tallyFailed) fill();
      else if (!document.querySelector('script[src="' + TALLY_JS + '"]')) {
        var s = document.createElement("script");
        s.src = TALLY_JS;
        s.onload = loadTally;
        s.onerror = function () { tallyFailed = true; fill(); };
        document.body.appendChild(s);
      }
    }
    function watch(frame) { frame.addEventListener("load", function () { if (frame.getAttribute("src")) wait.hidden = true; }); }
    watch(sec.querySelector("iframe"));
    return {
      lang: function (lang) {
        var id = formId(UPLOAD_FORM_URLS[lang]) || formId(UPLOAD_FORM_URL);
        sec.hidden = !id;
        if (!id || id === current) return;
        var old = sec.querySelector(".upload-embed iframe"), frame = old;
        if (current) {   // form change: a new iframe with the same attributes (title included) but none of those set by Tally
          frame = document.createElement("iframe");
          ["loading", "width", "height", "frameborder", "marginheight", "marginwidth", "data-i18n-title", "title"].forEach(function (a) { if (old.hasAttribute(a)) frame.setAttribute(a, old.getAttribute(a)); });
          watch(frame);
          old.replaceWith(frame);
        }
        current = id;
        wait.hidden = false;
        frame.setAttribute("data-tally-src", "https://tally.so/embed/" + id + "?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1");
        sec.querySelector("[data-upload-link]").href = "https://tally.so/r/" + id;
        loadTally();
      }
    };
  })();

  /* ---------- Events: one hook each for clicks, demo and form; GoatCounter always, Google Analytics only with consent ----------
     «Prova la demo» (hero) leads to the demo section; «Aprila a schermo intero» (in the section) opens the demo in this tab.
     Event names unchanged: cta-demo-hero / cta_demo hero and cta-demo-sezione / cta_demo demo. */
  (function () {
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a");
      if (!a) return;
      if (a.matches('.offer a[href="#manda-scheda"]')) {
        GA.track("cta_prenota");
        GC.count("cta-prenota", "Clic su «Prenota l'accesso anticipato»");
      } else if (a.matches('.offer a[href="#demo"]')) {
        GA.track("cta_demo", { cta_position: "hero" });
        GC.count("cta-demo-hero", "Click on «Prova la demo» (hero)");
      } else if (a.hasAttribute("data-demo-link")) {
        GA.track("cta_demo", { cta_position: "demo" });
        GC.count("cta-demo-sezione", "Click on «Aprila a schermo intero» (demo section)");
      } else if (a.hasAttribute("data-demo-shot")) {
        demoTouched("Tap on the demo image (phone)");   // below 600 px the still image is the demo
      }
    });
    // first touch of the demo, once per page (for GA, the first time with consent): inside the iframe (the demo has the same
    // origin) or, below 600 px, on the still image that opens it
    var frame = document.querySelector(".demo iframe"), demoGA = false, demoGC = false;
    function demoTouched(title) {
      if (!demoGC) { demoGC = true; GC.count("demo-interazione", title); }
      if (!demoGA) demoGA = GA.track("demo_interazione");
    }
    if (frame) frame.addEventListener("load", function () {
      try {
        frame.contentDocument.addEventListener("pointerdown", function () { demoTouched("First touch inside the demo"); }, true);
      } catch (err) {}
    });
    // «Prenota» in the bar of the fullscreen demo arrives here with ?from=demo-bar: counted once (GoatCounter always, GA only if
    // consent was already given), then the parameter leaves the address with history.replaceState, so a reload or a shared
    // link does not count it again. The page view keeps its path (/<lang> on GoatCounter).
    var here = new URL(location.href);
    if (here.searchParams.get("from") === "demo-bar") {
      GA.track("cta_prenota_demo_bar");
      GC.count("cta-prenota-demo-bar", "Click on «Prenota l'accesso anticipato» (fullscreen demo bar)");
      here.searchParams.delete("from");
      history.replaceState(history.state, "", here);
    }
    // modulo inviato: Tally manda «Tally.FormSubmitted» con postMessage (developers.tally.so/widgets/events); solo da tally.so,
    // e nessun dato del modulo va alle statistiche
    addEventListener("message", function (e) {
      if (e.origin !== "https://tally.so" || typeof e.data !== "string" || e.data.indexOf("Tally.FormSubmitted") === -1) return;
      try { var m = JSON.parse(e.data); if (m && m.event && m.event !== "Tally.FormSubmitted") return; } catch (err) { return; }
      GA.track("iscrizione");
      GC.count("iscrizione", "Modulo di accesso anticipato inviato");
    });
  })();

  /* ---------- Privacy notice: collapsed by default; a link to #privacy (the banner's «Informativa», a shared URL) opens it ---------- */
  (function () {
    var notice = document.getElementById("privacy");
    function openIfTarget() { if (location.hash === "#privacy") notice.open = true; }
    document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest('a[href="#privacy"]')) notice.open = true; });
    addEventListener("hashchange", openIfTarget);
    openIfTarget();
  })();

  render(detectLang());
  document.addEventListener("DOMContentLoaded", function () {
    render(detectLang());
    var nav = document.getElementById("langNav");
    if (nav) nav.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-lang]");
      if (btn) setLang(btn.getAttribute("data-lang"), true);
    });
  });
</script>
</body>
</html>
