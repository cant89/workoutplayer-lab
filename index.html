<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkoutPlayer — turn your training plan into a guided workout</title>
<meta name="description" content="Upload your trainer's plan: it becomes a guided workout with timer, sets, rest and notes. Try the live player.">
<meta name="robots" content="noindex, nofollow">
<!-- Icona: la stessa della PWA (app/icons, disegnata da app/icone.py); SVG per i browser che lo supportano, PNG per gli altri e per iOS. -->
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Pagina in 5 lingue (IT EN FR ES DE): vedi il dizionario DICT più sotto e README.md per come aggiungerne una. -->
<link rel="alternate" hreflang="it" href="?lang=it">
<link rel="alternate" hreflang="en" href="?lang=en">
<link rel="alternate" hreflang="fr" href="?lang=fr">
<link rel="alternate" hreflang="es" href="?lang=es">
<link rel="alternate" hreflang="de" href="?lang=de">
<link rel="alternate" hreflang="x-default" href="?lang=en">
<!-- Stessi caratteri del player (lib/tokens.css): se vuoi una pagina senza nessuna richiesta di rete, rimuovi
     questo link e i due qui sotto: i token hanno già un ripiego di sistema (Arial Narrow / system-ui). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<script>
  /* RACCOLTA SCHEDE — sezione "Accesso anticipato" (#manda-scheda), unico modulo della pagina (raccoglie scheda ed email).
     Link del modulo Tally (es. "https://tally.so/r/XXXX"). Se la svuoti la sezione sparisce e il pulsante del hero non porta più a niente. */
  const UPLOAD_FORM_URL = "https://tally.so/r/RGpLpd";
</script>
<style>
  /* ---------- Token e temi: copia di lib/tokens.css (fonte del design system del player) ---------- */
  :root {
    --bg: #ECEFEA; --surface: #FFFFFF; --surface-2: #E1E5DF; --line: #CFD5CD;
    --ink: #14181A; --ink-2: #49545A; --ink-3: #6F7B80;
    --work: #D9480B; --rest: #0A8070; --prep: #9A6A00; --on-phase: #FFFFFF;
    --note-bg: #FFF4D6; --note-ink: #4A3600; --note-line: #E9C767;
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1113; --surface: #181D20; --surface-2: #232A2E; --line: #2E373B;
      --ink: #F0F3EE; --ink-2: #B1BBBF; --ink-3: #87939A;
      --work: #FF6B2C; --rest: #2CC7B0; --prep: #F0B429; --on-phase: #0E1113;
      --note-bg: #2B2410; --note-ink: #F6E3A6; --note-line: #6B5618;
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 17px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { text-wrap: balance; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--work); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin-inline: auto; padding-inline: 24px; }
  .eyebrow { font: 600 13px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  section { padding-block: 56px; }

  /* ---------- Barra superiore ---------- */
  .top { border-bottom: 1px solid var(--line); }
  .top-row { padding-block: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font: 700 20px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  /* Icona dell'app accanto al nome: stesso disegno di icons/favicon.svg; nel tema scuro un filo di bordo la stacca dal fondo. */
  .brand-mark { width: 28px; height: 28px; flex: none; display: block; border-radius: 6px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-mark { box-shadow: 0 0 0 1px var(--line); } }
  .top-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .langs { display: flex; gap: 4px; }
  .langs button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 5px 9px;
    font: 600 12.5px/1 var(--body); letter-spacing: .04em; color: var(--ink-2);
  }
  .langs button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---------- Hero ---------- */
  /* Sotto i 900 px: tutto impilato, in un'unica colonna, nell'ordine del markup (mobile-first). */
  .hero .wrap { padding-block: 44px 8px; }
  .hero-head { text-align: center; max-width: 760px; margin-inline: auto; }
  .hero-head h1 {
    font: 700 clamp(34px, 5.2vw, 58px)/0.98 var(--display); text-transform: uppercase; letter-spacing: -.01em;
    margin-top: 10px;
  }
  .hero-foot { max-width: 560px; margin: 40px auto 0; text-align: center; }
  .hero-foot .lede { color: var(--ink-2); font-size: 18px; }
  .hero-foot .fine-print { color: var(--ink-3); font-size: 14.5px; margin-top: 10px; }
  .price {
    display: inline-flex; align-items: baseline; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 14px 18px; margin-top: 24px;
  }
  .price b { font: 700 34px/1 var(--display); }
  .price span { color: var(--ink-2); font-size: 14px; max-width: 22ch; text-align: left; }
  .cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 6px; padding: 15px 20px;
    font: 600 17px/1 var(--display); letter-spacing: .03em; text-transform: uppercase;
    background: var(--work); color: var(--on-phase); text-decoration: none;
  }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

  /* ---------- Come funziona: due passi, dal foglio all'app ----------
     1 · la foto del foglio scritto a mano («Allenamento di oggi»); 2 · il player sulla stessa scheda. Fra i due, una freccia a mano.
     < 900 px: in colonna nell'hero, prima del telefono; lì il passo 2 è la demo dal vivo e il telefono piccolo resta nascosto.
     ≥ 900 px: fascia sotto l'hero, foglio → freccia → telefono, stessa altezza per le due immagini.
     I formati sul foglio hanno due varianti, scelte con una classe su <ol class="steps">: «formati-ventaglio» (una pagina PDF,
     una foto e un foglio di calcolo aperti a ventaglio dietro il foglio; attiva) oppure «formati-icone» (tre icone in
     sovraimpressione sull'angolo del foglio). */
  .steps { list-style: none; margin: 40px 0 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 40px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 300px; text-align: center; }
  .steps .step { width: 100%; }
  .steps .step-2 { display: none; }
  .step-n { font: 700 52px/0.8 var(--display); color: var(--work); }
  .step-label { font: 600 17px/1.3 var(--body); color: var(--ink); }
  .step-fig { margin: 0 0 12px; width: 100%; aspect-ratio: 6 / 5; display: grid; place-items: center; }
  .formati-ventaglio .step-fig { aspect-ratio: 1; }
  .step-fig img { display: block; }
  /* 1 · la foto della scheda: carta vera, appena ruotata, con un'ombra morbida. La carta resta chiara anche nel tema scuro:
     quello che le sta sopra o dietro usa colori fissi (i valori chiari di --work, --rest, --ink). */
  .photo { position: relative; width: 86%; transform: rotate(-2deg); }
  .photo img { position: relative; z-index: 1; width: 100%; height: auto; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 16px 30px -14px rgba(0,0,0,.4); }
  .photo-mark { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; }
  /* variante «ventaglio»: i documenti dietro il foglio, disegnati in coordinate della foto (630×530) */
  .fan {
    display: none; position: absolute; z-index: 0; overflow: visible;
    left: calc(-70 / 630 * 100%); top: calc(-160 / 530 * 100%); width: calc(780 / 630 * 100%); height: calc(700 / 530 * 100%);
  }
  .fan-tag { font: 700 26px var(--display); fill: #fff; letter-spacing: .04em; }
  .formati-ventaglio .fan { display: block; }
  .formati-ventaglio .photo { width: 78%; translate: 0 14%; }
  /* variante «icone»: tre segni appoggiati sull'angolo in alto a destra del foglio */
  .formats { display: none; position: absolute; z-index: 3; top: -16px; right: -12px; align-items: flex-start; }
  .formati-icone .formats { display: flex; }
  .formats svg { width: 28px; height: 34px; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.16)) drop-shadow(0 4px 6px rgba(0,0,0,.14)); }
  .formats svg + svg { margin-left: -7px; }
  .formats svg:nth-child(1) { transform: rotate(-9deg) translateY(4px); }
  .formats svg:nth-child(2) { transform: rotate(2deg); }
  .formats svg:nth-child(3) { width: 32px; transform: rotate(10deg) translateY(5px); }
  .fmt-tag { font: 700 7px var(--display); fill: #fff; letter-spacing: .03em; }
  /* la freccia a mano fra i due passi, stesso tratto della sottolineatura: verticale sul telefono, orizzontale da 900 px;
     si disegna quando entra nello schermo, solo se il sistema non chiede meno movimento (script in fondo alla pagina) */
  .step-arrow { height: 72px; margin-block: -12px; display: grid; place-items: center; }
  .step-arrow svg { width: 84px; height: auto; overflow: visible; transform: rotate(90deg); }
  .step-arrow path { fill: none; stroke: var(--work); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: no-preference) {
    .step-arrow.draw path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .7s ease-out; }
    .step-arrow.draw path + path { transition-duration: .25s; transition-delay: .6s; }
    .step-arrow.draw.drawn path { stroke-dashoffset: 0; }
  }
  /* 2 · il player sullo squat, in un telefono con lo stesso stile di .phone (la demo dal vivo), tagliato sotto 2/4 e 75 kg */
  .mini-phone { position: relative; width: 56%; background: var(--ink); border-radius: 24px; padding: 7px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 16px 30px -14px rgba(0,0,0,.4); }
  .mini-phone::before {
    content: ""; position: absolute; top: 7px; left: 50%; translate: -50% 0; width: 26%; height: 12px;
    background: var(--ink); border-radius: 0 0 8px 8px; z-index: 2;
  }
  /* la fascia in alto fa da barra di stato: la tacca non copre la barra del player */
  .mini-phone picture { display: block; padding-top: 12px; background: var(--bg); border-radius: 17px; overflow: hidden; }
  .mini-phone img { width: 100%; height: auto; }
  /* Tema scuro: la carta si abbassa un poco e le ombre si fanno più scure, così le immagini non sembrano adesivi */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .photo { filter: brightness(.9); }
    :root:not([data-theme="light"]) .photo img { box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 18px 34px -12px rgba(0,0,0,.8); }
    :root:not([data-theme="light"]) .mini-phone { box-shadow: 0 18px 34px -12px rgba(0,0,0,.8); }
  }

  /* ---------- Telefono con la demo dal vivo ---------- */
  .phone-block { margin-top: 40px; display: flex; justify-content: center; }
  .phone-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .phone {
    width: min(360px, 100%); background: var(--ink); border-radius: 40px; padding: 12px; position: relative;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.35);
  }
  :root:not([data-theme="light"]) .phone { box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
  .phone::before {
    content: ""; position: absolute; top: 12px; left: 50%; translate: -50% 0; width: 90px; height: 22px;
    background: var(--ink); border-radius: 0 0 14px 14px; z-index: 2;
  }
  .screen {
    width: 100%; aspect-ratio: 390 / 800; border-radius: 28px; overflow: hidden; background: var(--bg);
    border: 1px solid rgba(255,255,255,.08);
  }
  .screen iframe { width: 100%; height: 100%; border: 0; display: block; }
  .phone-caption { text-align: center; }
  .phone-caption .eyebrow { display: block; }
  .phone-caption a { display: inline-block; margin-top: 4px; font-weight: 600; font-size: 14.5px; border-bottom: 1px solid var(--line); }

  /* ---------- ≥ 900 px: in alto testo a sinistra e telefono a destra, sotto la fascia dei due passi ---------- */
  @media (min-width: 900px) {
    .hero .wrap {
      display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto 1fr auto;
      grid-template-areas: "head phone" "foot phone" "steps steps"; column-gap: 56px; align-items: start;
    }
    .hero-head { grid-area: head; text-align: left; max-width: none; margin-inline: 0; }
    .steps {
      grid-area: steps; display: grid; grid-template-columns: minmax(0, 1.25fr) 120px minmax(0, 1fr); column-gap: 24px; align-items: start;
      margin-top: 64px; padding-top: 48px; border-top: 1px solid var(--line); --fig-h: 360px;
    }
    .steps .step { max-width: none; }
    .steps .step-2 { display: flex; }
    .step-fig, .formati-ventaglio .step-fig { aspect-ratio: auto; height: var(--fig-h); }
    .formati-ventaglio .photo { width: 70%; }
    .formats { transform: scale(1.2); transform-origin: top right; }
    .step-arrow { height: var(--fig-h); margin: 0; }
    .step-arrow svg { width: 120px; transform: none; }
    .fig-phone {
      place-items: start center; overflow: hidden; overflow: clip;
      -webkit-mask-image: linear-gradient(#000 calc(100% - 16px), transparent); mask-image: linear-gradient(#000 calc(100% - 16px), transparent);
    }
    /* telefono alto quanto il riquadro e tagliato sotto 2/4 e 75 kg: la larghezza si ricava dall'altezza del riquadro */
    .fig-phone .mini-phone { width: calc((var(--fig-h) - 49px) * .557 + 14px); margin-top: 8px; }
    .steps .step-n { font-size: 60px; }
    .hero-foot { grid-area: foot; text-align: left; max-width: 480px; margin: 30px 0 0; }
    .hero-foot .fine-print { text-align: left; }
    .cta-row { justify-content: flex-start; }
    .phone-block { grid-area: phone; margin-top: 4px; justify-content: flex-start; }
    .phone-block .phone { width: 340px; }
    .phone-block .step { display: none; }
  }
  @media (min-width: 1100px) { .steps { --fig-h: 420px; } }

  /* ---------- Pubblici ---------- */
  .aud-head { max-width: 56ch; }
  .aud-head h2 {
    font: 700 clamp(28px, 4vw, 40px)/1.02 var(--display); text-transform: uppercase; letter-spacing: -.005em; margin-top: 8px;
  }
  .aud-list { margin-top: 28px; }
  .aud {
    display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: start;
    padding-block: 22px; border-top: 1px solid var(--line);
  }
  .aud:last-child { border-bottom: 1px solid var(--line); }
  .aud-n { font: 700 40px/0.85 var(--display); color: var(--work); }
  .aud b {
    display: block; font: 600 21px/1.2 var(--display); text-transform: uppercase; letter-spacing: .01em; margin-bottom: 5px;
  }
  .aud p { color: var(--ink-2); font-size: 15.5px; max-width: 60ch; }
  .aud .case { color: var(--ink-3); font-size: 14px; margin-top: 6px; }

  /* ---------- Accesso anticipato, #manda-scheda (compare solo se UPLOAD_FORM_URL è impostata) ---------- */
  .upload { padding-block: 0 56px; }
  .upload h2 {
    font: 700 clamp(28px, 4vw, 40px)/1.02 var(--display); text-transform: uppercase; letter-spacing: -.005em; margin-top: 8px;
  }
  .upload-body { color: var(--ink-2); max-width: 62ch; margin-top: 12px; }
  .upload-warn {
    max-width: 520px; margin-top: 20px; padding: 12px 14px; border-radius: 6px; font-size: 15px; font-weight: 500;
    background: var(--note-bg); color: var(--note-ink); border: 1px solid var(--note-line); border-left-width: 4px;
  }
  /* Fondo sempre scuro: il modulo Tally è in tema scuro (testi chiari) a prescindere dal nostro tema. */
  .upload-embed { max-width: 520px; margin-top: 12px; background: #181D20; border: 1px solid #2E373B; border-radius: 12px; padding: 8px 12px 0; }
  .upload-embed iframe { display: block; max-width: 100%; }
  .upload-fallback { color: var(--ink-3); font-size: 14px; margin-top: 12px; }

  /* ---------- Piè di pagina ---------- */
  footer { border-top: 1px solid var(--line); }
  .legal { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding-block: 36px; }
  .legal h3 { font: 600 13px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .legal p { color: var(--ink-2); font-size: 14px; line-height: 1.55; }
  .legal p + p { margin-top: 8px; }
  @media (max-width: 640px) { .legal { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="top">
  <div class="wrap top-row">
    <span class="brand"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="22" fill="#0E1113"/><g fill="#FF6B2C"><rect x="32" y="19" width="14" height="62" rx="4.5"/><rect x="50" y="29" width="13" height="42" rx="4.5"/><rect x="67" y="39" width="12" height="22" rx="4.5"/></g></svg>WorkoutPlayer</span>
    <div class="top-right">
      <span class="eyebrow" data-i18n="topEyebrow"></span>
      <nav class="langs" id="langNav">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="de">DE</button>
      </nav>
    </div>
  </div>
</div>

<div class="hero">
  <div class="wrap">
    <div class="hero-head">
      <span class="eyebrow" data-i18n="heroEyebrow"></span>
      <h1 data-i18n="heroTitle"></h1>
    </div>

    <!-- Come funziona: due passi, dal foglio all'app (img/, vedi README). < 900 px in colonna prima del telefono (il passo 2 è la
         demo dal vivo); ≥ 900 px fascia sotto l'hero: foglio → freccia → telefono. Variante dei formati: classe su <ol class="steps">. -->
    <ol class="steps formati-ventaglio">
      <li class="step">
        <figure class="step-fig">
          <div class="photo">
            <svg class="fan" viewBox="-70 -160 780 700" aria-hidden="true" focusable="false">
              <g transform="rotate(-11 190 190)">
                <rect x="22" y="-110" width="340" height="440" rx="6" fill="#000" opacity=".07" transform="translate(4 6)"/>
                <path d="M28 -110h282l52 52v382a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6V-104a6 6 0 0 1 6-6z" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/>
                <path d="M310 -110v46a6 6 0 0 0 6 6h46" fill="#EEF0EB" stroke="#D3D8D0" stroke-width="2" stroke-linejoin="round"/>
                <rect x="52" y="-78" width="92" height="40" rx="6" fill="#D9480B"/>
                <text class="fan-tag" x="98" y="-49" text-anchor="middle">PDF</text>
                <rect x="52" y="-18" width="210" height="10" rx="4" fill="#D3D8D0"/><rect x="52" y="4" width="250" height="10" rx="4" fill="#D3D8D0"/><rect x="52" y="26" width="180" height="10" rx="4" fill="#D3D8D0"/>
              </g>
              <g transform="rotate(-2 330 60)">
                <rect x="196" y="-128" width="270" height="226" rx="4" fill="#000" opacity=".07" transform="translate(4 6)"/>
                <rect x="196" y="-128" width="270" height="226" rx="4" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/>
                <rect x="212" y="-112" width="238" height="164" fill="#CFE3DE"/>
                <circle cx="404" cy="-76" r="16" fill="#E9B949"/>
                <path d="M212 52l62-70 40 44 34-30 102 56z" fill="#6E9C92"/>
                <path d="M212 52l92-88 60 58 86 30z" fill="#4E7F74" opacity=".85"/>
              </g>
              <g transform="rotate(9 520 150)">
                <rect x="370" y="-86" width="330" height="420" rx="6" fill="#000" opacity=".07" transform="translate(4 6)"/>
                <rect x="370" y="-86" width="330" height="420" rx="6" fill="#FFFFFF" stroke="#D3D8D0" stroke-width="2"/>
                <rect x="370" y="-86" width="330" height="30" rx="6" fill="#0A8070"/><rect x="370" y="-66" width="330" height="10" fill="#0A8070"/>
                <rect x="370" y="-56" width="330" height="34" fill="#0A8070" opacity=".16"/>
                <g stroke="#0A8070" stroke-width="2" opacity=".55">
                  <path d="M370 -22h330M370 12h330M370 46h330M370 80h330M370 114h330"/>
                  <path d="M452 -56v420M534 -56v420M616 -56v420"/>
                </g>
              </g>
            </svg>
            <img src="img/scheda-manoscritta.webp" width="630" height="530" loading="lazy" decoding="async" data-i18n-alt="step1Alt"
                 alt="Foto di una scheda scritta a mano, «Allenamento di oggi»: squat 4x8 con 75 kg, affondi, panca con manubri, plank, curl per i bicipiti.">

  var SUPPORTED = ["it", "en", "fr", "es", "de"];
  var DEFAULT_LANG = "en";

  function detectLang() {
    var params = new URLSearchParams(location.search);
    var qLang = (params.get("lang") || "").toLowerCase();
    if (SUPPORTED.indexOf(qLang) !== -1) return qLang;
    var hashLang = location.hash.replace("#", "").toLowerCase();
    if (SUPPORTED.indexOf(hashLang) !== -1) return hashLang;
    try {
      var saved = localStorage.getItem("wp-lang");
      if (SUPPORTED.indexOf(saved) !== -1) return saved;
    } catch (e) {}
    var browserLangs = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < browserLangs.length; i++) {
      var code = (browserLangs[i] || "").slice(0, 2).toLowerCase();
      if (SUPPORTED.indexOf(code) !== -1) return code;
    }
    return DEFAULT_LANG;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render(lang) {
    var dict = DICT[lang] || DICT[DEFAULT_LANG];
    var fallback = DICT[DEFAULT_LANG];
    document.documentElement.lang = lang;
    document.title = dict.metaTitle || fallback.metaTitle;
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", dict.metaDescription || fallback.metaDescription);
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      var val = dict[key] != null ? dict[key] : fallback[key];
      if (val == null) return;
      el.innerHTML = escapeHtml(val).split("\n").join("<br>");
    });
    document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-title");
      var val = dict[key] != null ? dict[key] : fallback[key];
      if (val != null) el.title = val;
    });
    document.querySelectorAll("[data-i18n-alt]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-alt");
      var val = dict[key] != null ? dict[key] : fallback[key];
      if (val != null) el.alt = val;
    });
    var langNav = document.getElementById("langNav");
    if (langNav) {
      langNav.setAttribute("aria-label", dict.langLabel || fallback.langLabel);
      langNav.querySelectorAll("button").forEach(function (b) {
        b.setAttribute("aria-current", b.getAttribute("data-lang") === lang ? "true" : "false");
      });
    }
    var demoFile = "demo-" + lang + ".html";
    document.querySelectorAll("[data-demo-src]").forEach(function (el) { el.src = demoFile; });
    document.querySelectorAll("[data-demo-link]").forEach(function (el) { el.href = demoFile; });
    try { localStorage.setItem("wp-lang", lang); } catch (e) {}
  }

  function setLang(lang, updateUrl) {
    if (SUPPORTED.indexOf(lang) === -1) return;
    render(lang);
    if (updateUrl) {
      var url = new URL(location.href);
      url.searchParams.set("lang", lang);
      if (SUPPORTED.indexOf(location.hash.replace("#", "").toLowerCase()) !== -1) url.hash = "";
      history.replaceState(null, "", url);
    }
  }

  /* Freccia fra i due passi: si disegna quando entra nello schermo, solo se il sistema non chiede meno movimento */
  (function () {
    var arrow = document.querySelector(".step-arrow");
    if (!arrow || !("IntersectionObserver" in window) || !matchMedia("(prefers-reduced-motion: no-preference)").matches) return;
    arrow.classList.add("draw");
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) { arrow.classList.add("drawn"); io.disconnect(); }
    }, { threshold: 0.6 });
    io.observe(arrow);
  })();

  render(detectLang());
  document.addEventListener("DOMContentLoaded", function () {
    render(detectLang());
    var nav = document.getElementById("langNav");
    if (nav) nav.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-lang]");
      if (btn) setLang(btn.getAttribute("data-lang"), true);
    });
  });
</script>
