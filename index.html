<!-- Stessi caratteri del player (lib/tokens.css): se vuoi una pagina senza nessuna richiesta di rete, rimuovi
     questo link e i due qui sotto: i token hanno già un ripiego di sistema (Arial Narrow / system-ui). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<script>
  /* LISTA D'ATTESA — unico punto da cambiare prima di pubblicare la pagina.
     Sostituisci con il link del modulo vero (Tally, Google Form o simili): il pulsante e il link di riserva lo leggono da qui. */
  const WAITLIST_URL = "https://tally.so/r/jaNPLR";
</script>
<style>
  /* ---------- Token e temi: copia di lib/tokens.css (fonte del design system del player) ---------- */
  :root {
    --bg: #ECEFEA; --surface: #FFFFFF; --surface-2: #E1E5DF; --line: #CFD5CD;
    --ink: #14181A; --ink-2: #49545A; --ink-3: #6F7B80;
    --work: #D9480B; --rest: #0A8070; --prep: #9A6A00; --on-phase: #FFFFFF;
    --note-bg: #FFF4D6; --note-ink: #4A3600; --note-line: #E9C767;
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1113; --surface: #181D20; --surface-2: #232A2E; --line: #2E373B;
      --ink: #F0F3EE; --ink-2: #B1BBBF; --ink-3: #87939A;
      --work: #FF6B2C; --rest: #2CC7B0; --prep: #F0B429; --on-phase: #0E1113;
      --note-bg: #2B2410; --note-ink: #F6E3A6; --note-line: #6B5618;
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 17px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { text-wrap: balance; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--work); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin-inline: auto; padding-inline: 24px; }
  .eyebrow { font: 600 13px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  section { padding-block: 56px; }

  /* ---------- Barra superiore ---------- */
  .top { border-bottom: 1px solid var(--line); }
  .top-row { padding-block: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { font: 700 20px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .top-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .langs { display: flex; gap: 4px; }
  .langs button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 5px 9px;
    font: 600 12.5px/1 var(--body); letter-spacing: .04em; color: var(--ink-2);
  }
  .langs button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---------- Hero ---------- */
  /* Sotto i 900 px: tutto impilato, in un'unica colonna, nell'ordine del markup (mobile-first). */
  .hero .wrap { padding-block: 44px 8px; }
  .hero-head { text-align: center; max-width: 760px; margin-inline: auto; }
  .hero-head h1 {
    font: 700 clamp(34px, 5.2vw, 58px)/0.98 var(--display); text-transform: uppercase; letter-spacing: -.01em;
    margin-top: 10px;
  }
  .hero-foot { max-width: 560px; margin: 40px auto 0; text-align: center; }
  .hero-foot .lede { color: var(--ink-2); font-size: 18px; }
  .hero-foot .fine-print { color: var(--ink-3); font-size: 14.5px; margin-top: 10px; }
  .price {
    display: inline-flex; align-items: baseline; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 14px 18px; margin-top: 24px;
  }
  .price b { font: 700 34px/1 var(--display); }
  .price span { color: var(--ink-2); font-size: 14px; max-width: 22ch; text-align: left; }
  .cta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 6px; padding: 15px 20px;
    font: 600 17px/1 var(--display); letter-spacing: .03em; text-transform: uppercase;
    background: var(--work); color: var(--on-phase); text-decoration: none;
  }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

  /* ---------- Flusso "file → player" (< 900 px): documenti → freccia verticale, poi il telefono sotto ---------- */
  .flow-mobile { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .flow-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 0 0 auto; }
  .flow-docs { display: flex; gap: 10px; }
  .doc-icon { width: 60px; height: 78px; display: block; overflow: visible; }
  .flow-arrow { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; }
  .flow-arrow svg { width: 100%; height: 100%; overflow: visible; transform: rotate(90deg); }
  .flow-dot { opacity: .55; }
  @media (prefers-reduced-motion: no-preference) {
    .flow-dot-1 { animation: flowPulse 1.4s ease-in-out infinite; }
    .flow-dot-2 { animation: flowPulse 1.4s ease-in-out infinite .18s; }
    .flow-dot-3 { animation: flowPulse 1.4s ease-in-out infinite .36s; }
  }
  @keyframes flowPulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .step { display: flex; align-items: center; gap: 8px; max-width: 260px; }
  .step-n { font: 700 26px/1 var(--display); color: var(--work); }
  .step-label { font: 600 13.5px/1.25 var(--body); color: var(--ink-2); text-align: left; }

  /* ---------- I tre passi con icona (≥ 900 px), colonna sinistra ---------- */
  .steps-desktop { display: none; }
  .step-row { display: flex; align-items: center; gap: 16px; padding-block: 11px; }
  .step-icon { width: 40px; height: 40px; flex: 0 0 auto; display: block; overflow: visible; }
  .step-row .step-n { font: 700 15px/1 var(--display); color: var(--work); margin-right: 4px; }
  .step-row .step-label { font: 600 15.5px/1.35 var(--body); color: var(--ink-2); }

  /* ---------- Telefono con la demo dal vivo ---------- */
  .phone-block { margin-top: 22px; display: flex; justify-content: center; }
  .phone-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .phone {
    width: min(360px, 100%); background: var(--ink); border-radius: 40px; padding: 12px; position: relative;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.35);
  }
  :root:not([data-theme="light"]) .phone { box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
  .phone::before {
    content: ""; position: absolute; top: 12px; left: 50%; translate: -50% 0; width: 90px; height: 22px;
    background: var(--ink); border-radius: 0 0 14px 14px; z-index: 2;
  }
  .screen {
    width: 100%; aspect-ratio: 390 / 800; border-radius: 28px; overflow: hidden; background: var(--bg);
    border: 1px solid rgba(255,255,255,.08);
  }
  .screen iframe { width: 100%; height: 100%; border: 0; display: block; }
  .phone-caption { text-align: center; }
  .phone-caption .eyebrow { display: block; }
  .phone-caption a { display: inline-block; margin-top: 4px; font-weight: 600; font-size: 14.5px; border-bottom: 1px solid var(--line); }

  /* ---------- ≥ 900 px: due colonne, testo + passi a sinistra, telefono a destra, allineato in alto ---------- */
  @media (min-width: 900px) {
    .hero .wrap {
      display: grid; grid-template-columns: minmax(0, 1fr) 360px; column-gap: 56px; align-items: start;
    }
    .hero-head { grid-column: 1; grid-row: 1; text-align: left; max-width: none; margin-inline: 0; }
    .flow-mobile { display: none; }
    .steps-desktop { display: flex; flex-direction: column; grid-column: 1; grid-row: 2; margin-top: 30px; }
    .hero-foot { grid-column: 1; grid-row: 3; text-align: left; max-width: 480px; margin: 30px 0 0; }
    .hero-foot .fine-print { text-align: left; }
    .cta-row { justify-content: flex-start; }
    .phone-block { grid-column: 2; grid-row: 1 / span 3; margin-top: 4px; justify-content: flex-start; }
    .phone-block .phone { width: 340px; }
    .phone-block .step { display: none; }
  }

  /* ---------- Pubblici ---------- */
  .aud-head { max-width: 56ch; }
  .aud-head h2 {
    font: 700 clamp(28px, 4vw, 40px)/1.02 var(--display); text-transform: uppercase; letter-spacing: -.005em; margin-top: 8px;
  }
  .aud-list { margin-top: 28px; }
  .aud {
    display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: start;
    padding-block: 22px; border-top: 1px solid var(--line);
  }
  .aud:last-child { border-bottom: 1px solid var(--line); }
  .aud-n { font: 700 40px/0.85 var(--display); color: var(--work); }
  .aud b {
    display: block; font: 600 21px/1.2 var(--display); text-transform: uppercase; letter-spacing: .01em; margin-bottom: 5px;
  }
  .aud p { color: var(--ink-2); font-size: 15.5px; max-width: 60ch; }
  .aud .case { color: var(--ink-3); font-size: 14px; margin-top: 6px; }

  /* ---------- Lista d'attesa ---------- */
  .waitlist { background: var(--ink); color: var(--bg); }
  .waitlist .eyebrow { color: var(--ink-3); }
  :root:not([data-theme="light"]) .waitlist { background: var(--surface); color: var(--ink); }
  .waitlist h2 {
    font: 700 clamp(28px, 4vw, 40px)/1.05 var(--display); text-transform: uppercase; letter-spacing: -.005em; margin-top: 8px;
    max-width: 24ch;
  }
  .waitlist-note { color: var(--ink-3); font-size: 15px; margin: 8px 0 16px; }
  :root:not([data-theme="light"]) .waitlist-note { color: var(--ink-2); }
  .waitlist-embed { max-width: 520px; background: var(--bg); color: var(--ink); border-radius: 12px; padding: 8px 12px 0; }
  :root:not([data-theme="light"]) .waitlist-embed { background: var(--card, var(--bg)); }
  .waitlist-embed iframe { display: block; max-width: 100%; }
  .waitlist-fallback { color: var(--ink-3); font-size: 14px; margin-top: 12px; }
  .waitlist-fallback a { color: inherit; }
  :root:not([data-theme="light"]) .waitlist-fallback { color: var(--ink-2); }

  /* ---------- Piè di pagina ---------- */
  footer { border-top: 1px solid var(--line); }
  .legal { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding-block: 36px; }
  .legal h3 { font: 600 13px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .legal p { color: var(--ink-2); font-size: 14px; line-height: 1.55; }
  .legal p + p { margin-top: 8px; }
  @media (max-width: 640px) { .legal { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="top">
  <div class="wrap top-row">
    <span class="brand">WorkoutPlayer</span>
    <div class="top-right">
      <span class="eyebrow" data-i18n="topEyebrow"></span>
      <nav class="langs" id="langNav">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>

    </div>

</div>

<div class="hero">

      <span class="eyebrow" data-i18n="heroEyebrow"></span>

            <path d="M8 4h38l16 16v66a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>

            <rect x="14" y="34" width="26" height="6" rx="1.5" fill="var(--work)"/>
            <rect x="14" y="46" width="42" height="4" rx="1" fill="var(--ink-3)"/>

          </svg>
          <svg class="doc-icon" viewBox="0 0 70 90" aria-hidden="true">

            <path d="M4 24h62M4 40h62M4 56h62M4 72h62" stroke="var(--line)" stroke-width="1.5"/>
            <path d="M25 4v82M46 4v82" stroke="var(--line)" stroke-width="1.5"/>

          <svg class="doc-icon" viewBox="0 0 70 90" aria-hidden="true">

  var SUPPORTED = ["it", "en", "fr", "es", "de"];
  var DEFAULT_LANG = "en";

  function detectLang() {
    var params = new URLSearchParams(location.search);
    var qLang = (params.get("lang") || "").toLowerCase();
    if (SUPPORTED.indexOf(qLang) !== -1) return qLang;
    var hashLang = location.hash.replace("#", "").toLowerCase();
    if (SUPPORTED.indexOf(hashLang) !== -1) return hashLang;
    try {
      var saved = localStorage.getItem("wp-lang");
      if (SUPPORTED.indexOf(saved) !== -1) return saved;
    } catch (e) {}
    var browserLangs = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < browserLangs.length; i++) {
      var code = (browserLangs[i] || "").slice(0, 2).toLowerCase();
      if (SUPPORTED.indexOf(code) !== -1) return code;
    }
    return DEFAULT_LANG;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function applyWaitlistHref() {
    document.querySelectorAll("[data-waitlist]").forEach(function (el) { el.href = WAITLIST_URL; });
  }

  function render(lang) {
    var dict = DICT[lang] || DICT[DEFAULT_LANG];
    var fallback = DICT[DEFAULT_LANG];
    document.documentElement.lang = lang;
    document.title = dict.metaTitle || fallback.metaTitle;
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", dict.metaDescription || fallback.metaDescription);
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      var val = dict[key] != null ? dict[key] : fallback[key];
      if (val == null) return;
      el.innerHTML = escapeHtml(val).split("\n").join("<br>");
    });
    document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-title");
      var val = dict[key] != null ? dict[key] : fallback[key];
      if (val != null) el.title = val;
    });
    var langNav = document.getElementById("langNav");
    if (langNav) {
      langNav.setAttribute("aria-label", dict.langLabel || fallback.langLabel);
      langNav.querySelectorAll("button").forEach(function (b) {
        b.setAttribute("aria-current", b.getAttribute("data-lang") === lang ? "true" : "false");
      });
    }
    applyWaitlistHref();
    var demoFile = "demo-" + lang + ".html";
    document.querySelectorAll("[data-demo-src]").forEach(function (el) { el.src = demoFile; });
    document.querySelectorAll("[data-demo-link]").forEach(function (el) { el.href = demoFile; });
    try { localStorage.setItem("wp-lang", lang); } catch (e) {}
  }

  function setLang(lang, updateUrl) {
    if (SUPPORTED.indexOf(lang) === -1) return;
    render(lang);
    if (updateUrl) {
      var url = new URL(location.href);
      url.searchParams.set("lang", lang);
      if (SUPPORTED.indexOf(location.hash.replace("#", "").toLowerCase()) !== -1) url.hash = "";
      history.replaceState(null, "", url);
    }
  }

  render(detectLang());
  document.addEventListener("DOMContentLoaded", function () {
    render(detectLang());
    var nav = document.getElementById("langNav");
    if (nav) nav.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-lang]");
      if (btn) setLang(btn.getAttribute("data-lang"), true);
    });
  });
